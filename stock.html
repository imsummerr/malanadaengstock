<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <!-- GitHub Pages ตั้ง header กันฝังใน iframe ไม่ได้ (Netlify เคยตั้ง X-Frame-Options ให้) — กันด้วยสคริปต์แทน -->
  <script>if (window.top !== window.self) { try { window.top.location = window.self.location.href; } catch (e) { document.documentElement.style.display = 'none'; } }</script>
  <title>สต็อก — หม่าล่าหน้าแดง</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700;800&display=swap">
  <style>
    :root {
      --ink:      #0d0d0f;
      --ink-2:    #1c1c20;
      --ink-soft: #4a4a52;
      --muted:    #8e8e97;
      --line:     #e7e7ea;
      --paper:    #ffffff;
      --bg:       #f3f3f4;
      --red:      #e11d2f;
      --red-dark: #b3121f;
      --red-soft: #fff1f2;
      --green:    #0f9d58;
      --amber:    #b45309;
      --amber-bg: #fffbeb;
      --radius:   16px;
      --shadow:   0 1px 2px rgba(13,13,15,.05), 0 8px 24px rgba(13,13,15,.06);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; padding: 0; }
    body {
      background: var(--bg); color: var(--ink); font-size: 15px; line-height: 1.5;
      font-family: "IBM Plex Sans Thai", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-text-size-adjust: 100%;
    }
    .hidden { display: none !important; }

    /* ── Login ── */
    #login-page {
      min-height: 100dvh; display: flex; align-items: center; justify-content: center;
      padding: 24px; background: linear-gradient(160deg, #1c1c20, #0d0d0f);
    }
    .login-card {
      background: var(--paper); border-radius: 22px; padding: 32px 26px;
      width: 100%; max-width: 380px; box-shadow: 0 20px 60px rgba(0,0,0,.35);
    }
    .login-logo { font-size: 40px; line-height: 1; margin-bottom: 10px; }
    .field-label { display: block; font-size: 12.5px; font-weight: 700; color: var(--muted); margin-bottom: 6px; }
    .login-input {
      width: 100%; padding: 13px 14px; border: 1.5px solid var(--line); border-radius: 12px;
      font-size: 16px; font-family: inherit; background: var(--paper); color: var(--ink);
    }
    .login-input:focus { outline: none; border-color: var(--red); box-shadow: 0 0 0 3px var(--red-soft); }
    .login-error {
      background: var(--red-soft); border: 1px solid #fecdd3; border-radius: 10px;
      padding: 10px 12px; color: var(--red-dark); font-size: 13.5px; text-align: center;
    }
    .key {
      border: none; border-radius: 12px; font-family: inherit; font-weight: 700;
      cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    }
    .btn-red { background: var(--red); color: #fff; }
    .btn-red:active { background: var(--red-dark); }
    .btn-red:disabled { background: var(--muted); opacity: .55; cursor: not-allowed; }
    .spinner-sm {
      width: 14px; height: 14px; border: 2px solid rgba(255,255,255,.35);
      border-top-color: #fff; border-radius: 50%; display: inline-block;
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Topbar ── */
    .topbar {
      background: var(--ink); color: #fff; position: sticky; top: 0; z-index: 20;
      padding-top: env(safe-area-inset-top);
    }
    .topbar-inner { display: flex; align-items: center; gap: 10px; padding: 11px 14px; max-width: 780px; margin: 0 auto; }
    .topbar .logo { font-size: 22px; }
    .topbar .title { font-size: 15.5px; font-weight: 800; }
    .topbar .sub { font-size: 12px; color: #b9b9c0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .icon-btn { background: #ffffff1f; color: #fff; padding: 9px 11px; font-size: 14px; }
    .icon-btn:active { background: #ffffff33; }
    .chip-link { background: var(--red); color: #fff; text-decoration: none; font-size: 12.5px; padding: 9px 12px; }

    /* ── Tabs ── */
    .tabs {
      display: flex; gap: 6px; overflow-x: auto; padding: 10px 14px;
      background: var(--paper); border-bottom: 1px solid var(--line);
      position: sticky; top: 0; z-index: 15; scrollbar-width: none;
    }
    .tabs::-webkit-scrollbar { display: none; }
    .tab {
      flex: 0 0 auto; padding: 9px 14px; border-radius: 999px; border: 1px solid var(--line);
      background: var(--paper); color: var(--ink-soft); font-size: 13.5px; font-weight: 700;
      font-family: inherit; cursor: pointer; white-space: nowrap;
    }
    .tab.on { background: var(--ink); color: #fff; border-color: var(--ink); }

    /* ── Layout ── */
    .wrap { max-width: 780px; margin: 0 auto; padding: 14px 14px 40px; }
    .card { background: var(--paper); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px; margin-bottom: 14px; }
    .card h2 { margin: 0 0 4px; font-size: 16px; font-weight: 800; }
    .card .lead { margin: 0 0 14px; font-size: 13px; color: var(--muted); }
    label.fld { display: block; font-size: 12.5px; font-weight: 700; color: var(--muted); margin: 12px 0 6px; }
    input, select, textarea {
      width: 100%; padding: 12px 13px; border: 1.5px solid var(--line); border-radius: 12px;
      font-size: 16px; font-family: inherit; background: var(--paper); color: var(--ink);
    }
    input:focus, select:focus { outline: none; border-color: var(--red); box-shadow: 0 0 0 3px var(--red-soft); }
    .qtyrow { display: flex; gap: 10px; align-items: flex-end; }
    .qtyrow > div { flex: 1; }
    .qtyrow .plus { flex: 0 0 auto; padding-bottom: 13px; color: var(--muted); font-weight: 800; }
    .calc {
      background: var(--red-soft); border: 1px solid #fecdd3; border-radius: 12px;
      padding: 12px 14px; margin-top: 14px; font-size: 14.5px;
    }
    .calc .big { font-size: 20px; font-weight: 800; }
    .calc .sub { font-size: 12.5px; color: var(--ink-soft); margin-top: 3px; }
    .submit { width: 100%; padding: 14px; font-size: 15.5px; margin-top: 16px; }
    .note { font-size: 12.5px; color: var(--muted); margin-top: 8px; }
    .warnbox { background: var(--amber-bg); border: 1px solid #fde68a; color: var(--amber);
               border-radius: 12px; padding: 12px 14px; font-size: 13.5px; margin-bottom: 14px; }

    /* ── ตาราง / รายการ ── */
    .locblock { margin-bottom: 18px; }
    .locblock:last-child { margin-bottom: 0; }
    .loctitle { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 14.5px; margin-bottom: 8px; }
    .pill { font-size: 11.5px; font-weight: 700; padding: 3px 9px; border-radius: 999px; background: var(--red-soft); color: var(--red-dark); }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { text-align: left; padding: 9px 6px; border-bottom: 1px solid var(--line); }
    th { font-size: 11.5px; color: var(--muted); font-weight: 700; white-space: nowrap; }
    td.num { text-align: right; white-space: nowrap; }
    .low { color: var(--red); font-weight: 700; }
    .empty { text-align: center; color: var(--muted); padding: 22px 8px; font-size: 14px; }

    /* ── ฟอร์มนับสต็อก ── */
    .countrow { display: grid; grid-template-columns: 1fr 72px 72px 72px; gap: 6px; align-items: center;
                padding: 10px 0; border-bottom: 1px solid var(--line); }
    .countrow:last-of-type { border-bottom: none; }
    .countrow .nm { font-size: 14px; font-weight: 600; min-width: 0; }
    .countrow .nm small { display: block; color: var(--muted); font-weight: 400; font-size: 11.5px; }
    .countrow input { padding: 9px 10px; font-size: 15px; text-align: center; }
    .countrow.done .nm { color: var(--green); }
    .counthead { display: grid; grid-template-columns: 1fr 72px 72px 72px; gap: 6px;
                 font-size: 11.5px; color: var(--muted); font-weight: 700; padding-bottom: 6px; }
    .counthead span:not(:first-child) { text-align: center; }
    /* สาขานับแค่แพ็คกับไม้ ไม่มีช่องชิ้น */
    .nopc .countrow, .nopc .counthead { grid-template-columns: 1fr 80px 80px; }
    /* ครัวกลางมีช่อง "โล" แยก ของชั่งกรอกช่องโล ของแพ็คกรอก แพ็ค/ไม้/ชิ้น */
    .withkg .countrow, .withkg .counthead { grid-template-columns: 1fr 56px 56px 56px 56px; gap: 4px; }
    .withkg .countrow input { padding: 9px 4px; font-size: 14.5px; }
    /* ของที่นับเป็นระดับ (กระดูกหมู น้ำดำ) — ช่องเลือกกินทุกคอลัมน์ตัวเลข */
    .countrow .lvsel { grid-column: 2 / -1; padding: 9px 10px; font-size: 14px; }
    .progress { height: 6px; background: var(--line); border-radius: 999px; overflow: hidden; margin: 10px 0 4px; }
    .progress > div { height: 100%; background: var(--green); width: 0; transition: width .2s; }

    .toast {
      position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%);
      background: var(--ink); color: #fff; padding: 13px 18px; border-radius: 12px;
      font-size: 14px; z-index: 60; max-width: 92%; text-align: center; line-height: 1.45;
      box-shadow: 0 10px 30px rgba(0,0,0,.3);
    }
  </style>
</head>
<body>

<!-- ══════════ Login ══════════ -->
<div id="login-page">
  <div class="login-card">
    <div style="text-align:center;margin-bottom:24px;">
      <div class="login-logo">📦</div>
      <h1 style="font-size:22px;font-weight:800;margin:0 0 4px;">ระบบสต็อก</h1>
      <p style="font-size:13.5px;color:var(--muted);margin:0;">หม่าล่าหน้าแดง</p>
    </div>
    <div style="display:flex;flex-direction:column;gap:14px;">
      <div>
        <label class="field-label">Username</label>
        <input type="text" id="login-username" class="login-input" placeholder="กรอก username" autocomplete="username"
          onkeydown="if(event.key==='Enter') document.getElementById('login-password').focus()">
      </div>
      <div>
        <label class="field-label">Password</label>
        <input type="password" id="login-password" class="login-input" placeholder="กรอก password" autocomplete="current-password"
          onkeydown="if(event.key==='Enter') doLogin()">
      </div>
      <div id="login-error" class="login-error hidden"></div>
      <button onclick="doLogin()" id="login-btn" class="key btn-red" style="width:100%;padding:14px;font-size:15.5px;">เข้าสู่ระบบ</button>
    </div>
  </div>
</div>

<!-- ══════════ App ══════════ -->
<div id="app" class="hidden">
  <div class="topbar">
    <div class="topbar-inner">
      <div class="logo">📦</div>
      <div style="min-width:0;flex:1;">
        <div class="title">ระบบสต็อก</div>
        <div class="sub" id="hdr-sub">—</div>
      </div>
      <a href="pos.html" class="key chip-link" title="หน้าคิดเงิน">🧮</a>
      <button onclick="doLogout()" class="key icon-btn" title="ออกจากระบบ">⏻</button>
    </div>
  </div>

  <div class="tabs" id="tabs"></div>
  <div class="wrap" id="view"></div>
</div>

<script>
/* ════════════════════════════════════════════════════════
   ต่อกับ Apps Script ตัวเดียวกับ pos.html / pos-dashboard.html
   → login ครั้งเดียวใช้ได้ทุกหน้า
   ════════════════════════════════════════════════════════ */
const DEFAULT_API_URL = 'https://script.google.com/macros/s/AKfycbyUTyLPdKsi7dh0SAM9x3l-cRak7yM9rW64nLRV8jtMlMc0qq8I0-bPT9HRdtcPrIc2Bg/exec';

function apiUrl() {
  let s = {};
  try { s = JSON.parse(localStorage.getItem('pos_settings') || '{}'); } catch (e) {}
  // URL ที่มากับไฟล์มาก่อนเสมอ — ค่าที่เคยตั้งเองไว้ใช้ต่อเมื่อไฟล์ไม่ได้ระบุ
  // เพราะทุกครั้งที่ Deploy ใหม่แล้ว URL เปลี่ยน ไฟล์จะถูกอัปเดตให้ แต่ค่าที่
  // ตั้งเองค้างอยู่ใน localStorage จะทับตัวใหม่เงียบ ๆ แล้วยิงไป deployment ที่ตายแล้ว
  return (DEFAULT_API_URL || s.apiUrl || '').trim();
}

/* รุ่นของหน้าเว็บ — โชว์ไว้บนหัวจอ เวลาเจอ "ทำไมไม่ขึ้น" จะได้รู้ทันที
   ว่าเครื่องนั้นเปิดไฟล์เก่าค้างอยู่ หรือได้ตัวใหม่แล้วจริง
   แก้เลขนี้ทุกครั้งที่แก้หน้านี้ */
const PAGE_BUILD = '2026-10-23a';

const auth = { token: '', name: '', branch: '', branches: [], role: 'staff' };

/* ช่อง "สาขา" ในชีตผู้ใช้งาน อาจมีหลายที่
   คนที่ทำทั้งหน้าร้านและครัวกลาง เขียนแยกแถวในชีต หรือใส่ช่องเดียวคั่นด้วย , / |
   ฝั่งเซิร์ฟเวอร์รวมมาให้แล้ว ตรงนี้แค่แตกกลับเป็น list */
const splitLocs = v => String(v || '').split(/[,/|\n]+/).map(x => x.trim()).filter(Boolean);

function readAuth() {
  try {
    auth.token  = sessionStorage.getItem('pos_token')  || '';
    auth.name   = sessionStorage.getItem('pos_name')   || '';
    auth.branch = sessionStorage.getItem('pos_branch') || '';
    auth.role   = sessionStorage.getItem('pos_role')   || 'staff';
    auth.branches = splitLocs(sessionStorage.getItem('pos_branches') || auth.branch);
  } catch (e) {}
}
function isOwner() { return auth.role === 'owner'; }
/* สิทธิ์แบ่งตามช่อง "สาขา" ในชีตผู้ใช้งาน
     สาขา = ครัวกลาง → พนักงานครัวกลาง  สต็อกคงเหลือ / ของเข้าครัวกลาง / เช็คสต็อก / ของเสีย
     สาขา = ชื่อสาขา  → พนักงานสาขา      ของเข้าร้าน / เช็คสต็อก / ของเสีย เฉพาะสาขาตัวเอง
     เจ้าของร้าน ทำได้ทุกอย่างทุกสถานที่ */
const myLocs = () => (auth.branches.length ? auth.branches : splitLocs(auth.branch));
function isCentral() { return isOwner() || myLocs().indexOf('ครัวกลาง') !== -1; }
function isBranch()  { return isOwner() || myLocs().some(l => l && l !== 'ครัวกลาง'); }
function canSee(who) {
  if (who === 'owner')   return isOwner();
  if (who === 'both')    return isCentral() || isBranch();
  if (who === 'central') return isCentral();
  return isBranch();
}

const esc = s => String(s == null ? '' : s)
  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

let toastTimer = null;
/** error แบบ URL เก่า — ขึ้นปุ่มให้กดรีเซ็ตเลย ไม่ต้องไปหาเมนูตั้งค่า */
function toastApiError(msg) {
  const extra = usingSavedUrl()
    ? '<br><button class="key" style="margin-top:10px;background:#fff;color:#111"' +
      ' onclick="resetApiUrl()">ใช้ URL ที่มากับไฟล์</button>'
    : '';
  toast(esc(msg).replace(/\n/g, '<br>') + extra, 15000);
}

function toast(html, ms) {
  const old = document.querySelector('.toast');
  if (old) old.remove();
  clearTimeout(toastTimer);
  const el = document.createElement('div');
  el.className = 'toast';
  el.innerHTML = html;
  document.body.appendChild(el);
  toastTimer = setTimeout(() => el.remove(), ms || 3500);
}

/* ── เรียก API ── */
async function apiPost(body) {
  const res = await fetch(apiUrl(), {
    method: 'POST', headers: { 'Content-Type': 'text/plain' },
    body: JSON.stringify(Object.assign({ token: auth.token }, body))
  });
  return handle(await res.json());
}
/**
 * รหัสบันทึก — ข้อมูลชุดเดิมได้รหัสเดิม (เน็ตหลุดตอนรอคำตอบแล้วกดบันทึกซ้ำ หลังบ้านไม่ลงซ้ำ)
 * แก้ช่องไหนก็ตาม = รหัสใหม่ · บันทึกสำเร็จแล้วล้างทิ้ง ส่งของชุดเดิมอีกรอบตั้งใจ = แถวใหม่
 */
const REQ = {};
function reqIdFor(kind, payload) {
  const key = JSON.stringify(payload);
  if (!REQ[kind] || REQ[kind].key !== key) {
    REQ[kind] = { key, id: 'W' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7) };
  }
  return REQ[kind].id;
}
function reqDone(kind) { delete REQ[kind]; }
const dupNote = r => r.duplicated ? '<br><b>รายการนี้บันทึกไปแล้วตั้งแต่รอบก่อน ไม่ได้ลงซ้ำ</b>' : '';

async function apiGet(params) {
  const q = new URLSearchParams(Object.assign({ token: auth.token, _: Date.now() }, params));
  const res = await fetch(apiUrl() + '?' + q, { cache: 'no-store' });
  return handle(await res.json());
}
function handle(json) {
  if (json.code === 401) { doLogout(); throw new Error('Session หมดอายุ กรุณา Login ใหม่'); }
  if (!json.success && /ไม่รู้จัก action/.test(json.message || '')) {
    throw new Error('Apps Script ยังเป็นเวอร์ชันเก่า — เปิด Apps Script แล้วกด ทำให้ใช้งานได้ → ' +
                    'จัดการรุ่นการทำให้ใช้งานได้ → แก้ไข → เวอร์ชันใหม่ → ทำให้ใช้งานได้');
  }
  if (!json.success) throw new Error(json.message || 'ทำรายการไม่สำเร็จ');
  return json;
}

/* ── Login ── */
async function doLogin() {
  const username = document.getElementById('login-username').value.trim();
  const password = document.getElementById('login-password').value.trim();
  const errEl = document.getElementById('login-error');
  const btn = document.getElementById('login-btn');
  errEl.classList.add('hidden');
  if (!username || !password) {
    errEl.textContent = 'กรอก username และ password';
    errEl.classList.remove('hidden');
    return;
  }
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner-sm"></span> กำลังตรวจสอบ...';
  try {
    const res = await fetch(apiUrl(), {
      method: 'POST', headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify({ action: 'login', username, password })
    });
    const data = await res.json();
    if (data.success) {
      sessionStorage.setItem('pos_token', data.token);
      sessionStorage.setItem('pos_name', data.name);
      sessionStorage.setItem('pos_branch', data.branch || '');
      sessionStorage.setItem('pos_branches', (data.branches || []).join(', ') || (data.branch || ''));
      sessionStorage.setItem('pos_role', data.role === 'owner' ? 'owner' : 'staff');
      showApp();
    } else {
      errEl.textContent = data.message || 'Login ไม่สำเร็จ';
      errEl.classList.remove('hidden');
      document.getElementById('login-password').value = '';
    }
  } catch (e) {
    errEl.textContent = 'เชื่อมต่อ Server ไม่ได้';
    errEl.classList.remove('hidden');
  }
  btn.disabled = false;
  btn.innerHTML = 'เข้าสู่ระบบ';
}

function doLogout() {
  const token = auth.token;
  ['pos_token', 'pos_name', 'pos_branch', 'pos_branches', 'pos_role'].forEach(k => sessionStorage.removeItem(k));
  if (token) {
    fetch(apiUrl(), {
      method: 'POST', headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify({ action: 'logout', token })
    }).catch(() => {});
  }
  clearBootCache();
  auth.token = '';
  document.getElementById('app').classList.add('hidden');
  document.getElementById('login-page').classList.remove('hidden');
}

/* ════════════════════════════════════════════════════════
   ข้อมูลและการแปลงหน่วย — ตรรกะเดียวกับฝั่งเซิร์ฟเวอร์
   เก็บยอดเป็นหน่วยย่อย (ไม้/กรัม) แปลงเป็นแพ็คตอนแสดงผล
   ════════════════════════════════════════════════════════ */
let D = { items: [], locations: [], stock: [], central: 'ครัวกลาง' };

const itemOf = n => D.items.find(i => i.name === n) || null;

/* สินค้าบางอย่างมีเฉพาะครัวกลาง (ผงปรุง วัตถุดิบดิบ) บางอย่างมีเฉพาะหน้าร้าน
   (น้ำซุปที่ผสมเสร็จแล้ว) ช่อง "ใช้ที่" ในชีตรายการสินค้าเป็นตัวกำหนด
   เว้นว่าง = ใช้ได้ทั้งสองที่ */
const SCOPE_CENTRAL = 'ครัวกลาง', SCOPE_SHOP = 'ร้าน';

/* ชนิดสินค้า — ของไหลผ่าน 3 ชั้น
     วัตถุดิบ ซื้อเป็นโล เข้าครัวกลาง → ของแพ็ค นับเป็นแพ็ค → ส่งร้าน */
const KIND_RAW    = 'วัตถุดิบ';
const KIND_PACKED = 'ของแพ็ค';
const isRaw    = i => i.kind === KIND_RAW;
const isPacked = i => i.kind === KIND_PACKED;
const rawItems = () => D.items.filter(isRaw);
/** ของที่ส่งร้าน/ขายได้ — ไม่รวมวัตถุดิบ เพราะยังแพ็คไม่ได้ ขายไม่ได้ */
const packedItems = loc => itemsFor(loc).filter(i => !isRaw(i));
/**
 * ของเข้าครัวกลาง = ของที่ "ซื้อมา" เท่านั้น — วัตถุดิบ (ดิบ) กับของใช้
 * ของที่แพ็คแล้วไม่โผล่ เพราะมันเกิดจากแท็บแพ็คของ ไม่ได้ซื้อเข้ามาตรง ๆ
 * ถ้าโชว์ทั้งคู่ พนักงานจะเจอ "ดอลลี่" กับ "ดอลลี่ (ดิบ)" แล้วเลือกผิด
 */
// ยกเว้นของพร้อมส่ง (ready — ฟองเต้าหู้ม้วน) ไม่มีของดิบ ซื้อเข้ามาเป็นตัวมันเองเลย
const buyItems = loc => itemsFor(loc).filter(i => !isPacked(i) || i.ready);
// ของเสียตัดวัตถุดิบได้ด้วย — ของแช่แข็งละลายแล้วเหลือน้อยกว่าที่ซื้อ
// ส่วนที่หายไปคือน้ำแข็ง ต้องตัดออก ไม่งั้นยอดครัวกลางบวมค้างไว้ตลอด
const wasteItems  = loc => itemsFor(loc);

/**
 * ช่อง "ชิ้น" มีเฉพาะครัวกลาง — สาขานับแค่แพ็คกับไม้
 * ลูกชิ้นที่หลุดจากไม้ที่สาขาไม่ได้นับทีละลูก ปล่อยช่องไว้ก็มีแต่จะกรอกผิด
 */
const piecesAt = loc => loc === D.central;

/** สินค้าที่ลงได้ที่สถานที่นี้ */
function itemsFor(loc) {
  const want = (loc === D.central) ? SCOPE_CENTRAL : SCOPE_SHOP;
  return D.items.filter(i => !i.scope || i.scope === want);
}

/** สถานที่ที่ผู้ใช้คนนี้ลงรายการได้ — เจ้าของทุกที่ ครัวกลางเฉพาะครัวกลาง สาขาเฉพาะสาขาตัวเอง */
function allowedLocs() {
  if (isOwner()) return D.locations;
  const mine = myLocs();
  const out = D.locations.filter(l => mine.indexOf(l) !== -1);
  // เผื่อสาขาของตัวเองยังไม่โผล่ในรายชื่อที่เซิร์ฟเวอร์ส่งมา
  mine.forEach(l => { if (out.indexOf(l) === -1) out.push(l); });
  return out;
}

/* หน่วย 3 ชั้น: แพ็ค → ไม้ → ชิ้น  (ตรรกะเดียวกับฝั่งเซิร์ฟเวอร์)
   ลูกชิ้นเสียบไม้ละหลายชิ้น เศษเลยมี 2 แบบ ครบไม้แต่ไม่ครบแพ็ค (นับเป็นไม้)
   กับไม่ครบไม้ (นับเป็นชิ้น) ของที่ไม้ละชิ้นก็เหลือ 2 ชั้นเหมือนเดิม */
const perStickOf = it => { const n = Number(it && it.perStick) || 1; return n > 0 ? n : 1; };
/** หน่วยเล็กสุดที่ใช้เก็บยอด */
const baseUnitOf = it => perStickOf(it) > 1 ? 'ชิ้น' : (it ? it.subUnit : '');
/** ของตัวนี้ต้องมีช่อง "ชิ้น" ให้กรอกไหม */
const hasPieces = it => perStickOf(it) > 1;

function toBase(packs, sticks, pieces, it) {
  const perStick = perStickOf(it);
  const perPack = Number(it && it.perPack) > 0 ? Number(it.perPack) : 1;
  return Math.round(((Number(packs) || 0) * perPack * perStick +
                     (Number(sticks) || 0) * perStick +
                     (Number(pieces) || 0)) * 1000) / 1000;
}
function fmtPack(base, it) {
  base = Math.round((Number(base) || 0) * 1000) / 1000;
  const perStick = perStickOf(it);
  const perPack = Number(it && it.perPack) > 0 ? Number(it.perPack) : 1;
  if (!it || (perPack <= 1 && perStick <= 1)) return base + ' ' + (it ? it.subUnit : '');

  const neg = base < 0, a = Math.abs(base), sign = neg ? -1 : 1;
  const perPackBase = perPack * perStick;
  const packs = perPackBase > 1 ? Math.floor(a / perPackBase) : 0;
  const left = Math.round((a - packs * perPackBase) * 1000) / 1000;
  const sticks = perStick > 1 ? Math.floor(left / perStick) : left;
  const pieces = perStick > 1 ? Math.round((left - sticks * perStick) * 1000) / 1000 : 0;

  const out = [];
  if (packs)  out.push(sign * packs + ' ' + it.packUnit);
  if (sticks) out.push(sign * sticks + ' ' + it.subUnit);
  if (pieces) out.push(sign * pieces + ' ชิ้น');
  return out.length ? out.join(' ') : '0 ' + it.packUnit;
}
function balOf(loc, name) {
  const L = D.stock.find(s => s.name === loc);
  if (!L) return 0;
  const r = L.rows.find(x => x.item === name);
  return r ? r.base : 0;
}

/**
 * ไฟล์ .gs ที่ควรเป็นรุ่นล่าสุด — หลังบ้านบอกรุ่นที่วางอยู่จริง (D.files) ไฟล์ไหนเก่ากว่านี้ขึ้นเตือนเจ้าของ
 * แก้ไฟล์ไหนใน repo เปลี่ยนรุ่นของไฟล์นั้นตรงนี้ด้วย (และใน GS_FILES ของไฟล์นั้น)
 */
const WANT_FILES = { 'pos-backend.gs': '2026-10-23a', 'stock-costing.gs': '2026-10-17b', 'line-intake.gs': '2026-10-16a',
                     'stock-audit.gs': '2026-10-22a', 'line-expiry-alert.gs': '2026-10-13' };
function staleFiles() {
  if (!D.files) {   // หลังบ้านเก่ากว่าตัวที่บอกรุ่นไฟล์ได้
    const ver = D.version ? String(D.version).split('·')[0].trim() : '';
    return ver < WANT_FILES['pos-backend.gs'] ? ['pos-backend.gs'] : [];
  }
  return Object.keys(WANT_FILES).filter(f => String(D.files[f] || '') < WANT_FILES[f]);
}

function filesBanner() { return `<div id="files-banner">${filesBannerInner()}</div>`; }

/**
 * ลืมนับ/ลืมกรอกของวันขายก่อน (หลังบ้านส่ง D.late มา) — ขึ้นบนสุดทุกแท็บ จนกว่าจะลงย้อนหลังครบ
 *   หม่าล่า: นับปิดร้าน / กรอกเงินปิดร้าน ตอนนี้ก่อนขายบิลแรก = ของวันนั้น (ขายบิลแรกแล้วหายไปเอง)
 *   เบเกอรี่: นับหลังขายย้อนหลัง
 */
function lateBanner() {
  const L = D.late || {}, out = [];
  Object.keys(L).forEach(loc => {
    const s = L[loc] || {}, rows = [];
    const btn = (label, js) => ` <button class="key" style="display:inline-block;width:auto;padding:4px 10px;margin:4px 0 0;font-size:13px"
        onclick="${js}">${label}</button>`;
    if (s.mala && s.mala.count) rows.push(s.mala.afterBill
      // 22/10: วันนี้ขายไปแล้วก็ลงย้อนหลังได้ — ตอนนับเลือกว่าเป็นปิดร้านของวันนั้น (เหมือนเบเกอรี่)
      ? `📋 <b>เช็คสต็อกย้อนหลังของวันที่ ${s.mala.dm}</b> — วันนี้ขายไปแล้ว ตอนนับเลือก "ปิดร้าน ${s.mala.dm} (ลืมนับ)"` +
        btn('ไปนับ', `C_FOR='late';C_FOR_LOC='${esc(loc)}';go('count')`)
      : `📋 <b>เช็คสต็อกของวันที่ ${s.mala.dm}</b> ก่อนขายวันที่ ${s.mala.today || 'วันนี้'}
        — นับตอนนี้ก่อนขายบิลแรก ระบบใช้เป็นยอดปิดร้านของ ${s.mala.dm}` + btn('ไปนับ', "go('count')"));
    // ค่าใช้จ่าย + เงินสดคงเหลือ เจ้าของร้านแจ้งในไลน์ — พนักงานไม่ต้องเห็น
    if (s.exp && auth.role === 'owner') rows.push(`💬 <b>แจ้งค่าใช้จ่ายของวันที่ ${s.exp.dm}</b> ในไลน์ (+ เงินสดคงเหลือ)
        — เขียน ${s.exp.dm} ไว้บรรทัดแรก · ไม่มีจ่ายพิมพ์ "ไม่มีค่าใช้จ่าย" · ครบแล้วระบบสรุปยอดให้` + expDoneUi(loc, s.exp, btn));
    if (s.bakery) rows.push(`🍡 <b>นับหลังขายเบเกอรี่</b> ของ ${s.bakery.dm}` +
        (s.bakery.counted ? ' — เช้านี้นับเบเกอรี่แล้ว กรอกแค่เงิน' : ' — นับของที่เหลือตอนนี้ก่อนเริ่มขาย แล้วกรอกเงิน') +

  });
  return out.length ? `<div class="card" id="late-banner"><div class="warnbox" style="margin:0">${out.join('<hr>')}</div></div>` : '';
}
/** วาดกล่องเตือนใหม่อย่างเดียว — ไม่ render ทั้งหน้า (ฟอร์มที่กรอกค้างไว้ไม่หาย) */

/**
 * เจ้าของกด "ค่าใช้จ่ายลงครบแล้ว" — จดว่าแจ้งแล้ว แล้วหลังบ้านสรุปยอดของวันนั้นให้ (ถ้าเช็คสต็อกครบ)
 * ยืนยันในกล่องเตือนเอง ไม่ใช้ confirm() — เบราว์เซอร์ในแอป (เช่นเปิดลิงก์จากไลน์) บางตัวไม่ขึ้นกล่อง
 * แล้วถือว่ากดยกเลิก กดไปก็เงียบ (14/10)
 */
const EXP_DONE_BE = '2026-10-14a';          // หลังบ้านรุ่นนี้ขึ้นไปถึงรู้จัก action expDone
let EXP_ARM = '', EXP_BUSY = '';
function expDoneUi(loc, e, btn) {
  const k = loc + '|' + e.day, ver = D.version ? String(D.version).split('·')[0].trim() : '';
  const go = `expDoneGo('${esc(loc)}','${esc(e.day)}','${esc(e.dm)}')`;
  if (ver < EXP_DONE_BE) return `<br><small>ลงครบแล้วทางอื่น (ไม่ได้ลงในไลน์): ต้อง Deploy หลังบ้านรุ่น ${EXP_DONE_BE}
      ก่อน ถึงจะมีปุ่มให้กด (ตอนนี้หลังบ้าน ${esc(ver || 'เก่า')})</small>`;
  if (EXP_BUSY === k) return `<br><b>⏳ กำลังจดและสรุปยอดวันที่ ${e.dm}… รอสักครู่</b>`;
  if (EXP_ARM === k) return `<br><b>ค่าใช้จ่ายของวันที่ ${e.dm} ลงครบแล้วจริงไหม?</b> ระบบจะสรุปยอดของวันนั้นให้<br>` +
      btn('✅ ยืนยัน ลงครบแล้ว', go) + btn('ยกเลิก', "expDoneArm('')");
  return `<br><small>ลงครบแล้วทางอื่น (ไม่ได้ลงในไลน์) กดปุ่มนี้แทนได้</small>` +
      btn('✅ ค่าใช้จ่ายลงครบแล้ว', `expDoneArm('${esc(k)}')`);
}
function expDoneArm(k) { EXP_ARM = k; lateRefresh(); }
async function expDoneGo(loc, day, dm) {
  const k = loc + '|' + day;
  if (EXP_BUSY) return;
  EXP_ARM = ''; EXP_BUSY = k; lateRefresh();
  toast('⏳ กำลังจดและสรุปยอดวันที่ ' + esc(dm) + '…', 60000);
  try {
    const r = await apiPost({ action: 'expDone', location: loc, day });
    if (D.late && D.late[loc]) D.late[loc].exp = null;
    toast('✅ ' + esc(r.message || 'จดแล้ว'), 8000);
  } catch (e) {
    if (/เวอร์ชันเก่า|ไม่รู้จัก action/.test(e.message)) toastApiError(e.message);
    else toast('❌ ' + esc(e.message), 10000);
  } finally {
    EXP_BUSY = ''; lateRefresh();
  }
}

    return;
  }
  // บัญชีหม่าล่ากับเบเกอรี่แยกกัน — สลับด้วยปุ่มด้านบน (หลังบ้านเก่าไม่มีเบเกอรี่ = หม่าล่าอย่างเดียว)
  const isBk = MONEY_BIZ === 'เบเกอรี่' && MONEY.bakery;
  const isAll = MONEY_BIZ === 'รวม' && MONEY.total;
  const M = isBk  ? Object.assign({ central: MONEY.central, warn: [] }, MONEY.bakery)
          : isAll ? Object.assign({ central: MONEY.central, warn: MONEY.warn }, MONEY.total)
          : MONEY;
  const locs = Object.keys(M.pl).sort((a, b) =>
    a === M.central ? -1 : b === M.central ? 1 : a.localeCompare(b, 'th'));

  const cards = locs.map((loc, ci) => {
    const p = M.pl[loc];
    const o = M.owed[loc];
    const st = M.stock[loc] || { rows: [], total: 0 };
    const isC = loc === M.central;

    // ครัวกลางไม่มีรายได้ ส่งต่อที่ต้นทุน กำไรไปโผล่ที่สาขาทั้งหมด
    const sales = isBk ? `
        <tr><td>เงินสด</td><td class="num">${baht(p['เงินสด'])}</td></tr>
        <tr><td>เงินโอน</td><td class="num">${baht(p['เงินโอน'])}</td></tr>
        <tr><td>ไทยช่วยไทย</td><td class="num">${baht(p['ไทยช่วยไทย'])}</td></tr>${p['จ่ายจากเงินขาย'] ? `
        <tr><td>จ่ายค่าใช้จ่ายจากเงินขาย <small>เงินสด · หักอยู่ในค่าใช้จ่ายอื่นด้วย</small></td><td class="num">${baht(p['จ่ายจากเงินขาย'])}</td></tr>` : ''}` : isAll ? `
        <tr><td>หม่าล่า หน้าร้าน</td><td class="num">${baht(p['หน้าร้าน'])}</td></tr>
        <tr><td>หม่าล่า เดลิเวอรี่</td><td class="num">${baht(p['เดลิเวอรี่'])}</td></tr>
        <tr><td>เบเกอรี่</td><td class="num">${baht(p['ขายเบเกอรี่'])}</td></tr>` : `
        <tr><td>ขายหน้าร้าน</td><td class="num">${baht(p['หน้าร้าน'])}</td></tr>
        <tr><td>เดลิเวอรี่</td><td class="num">${baht(p['เดลิเวอรี่'])}</td></tr>`;
    const money = isC ? '' : `
      <table><tbody>${sales}
        <tr><td><b>รายได้รวม</b></td><td class="num"><b>${baht(p['รายได้'])}</b></td></tr>
        <tr><td>− ${isBk ? 'ต้นทุนเบเกอรี่ที่ขายไป' : 'ค่าใช้จ่ายวัตถุดิบ'}</td><td class="num">${baht(p['ค่าใช้จ่ายวัตถุดิบ'])}</td></tr>
        <tr><td>− ของเสีย</td><td class="num">${baht(p['ของเสีย'])}</td></tr>${lostRow(p['ของหาย'], isAll)}
        <tr><td><b>กำไรขั้นต้น</b></td><td class="num"><b>${baht(p['กำไรขั้นต้น'])}</b></td></tr>
        ${expenseRows(p, 'ex' + ci)}
        <tr><td><b>กำไรสุทธิ</b></td><td class="num ${p['กำไรสุทธิ'] < 0 ? 'low' : ''}">
            <b>${baht(p['กำไรสุทธิ'])}</b></td></tr>
        ${isAll ? `<tr><td><small>· มาจากหม่าล่า</small></td><td class="num"><small>${baht(p['กำไรหม่าล่า'])}</small></td></tr>
        <tr><td><small>· มาจากเบเกอรี่</small></td><td class="num"><small>${baht(p['กำไรเบเกอรี่'])}</small></td></tr>` : ''}
      </tbody></table>`;

    // หลังบ้านเก่าไม่มีช่องกำไร/ค่าไม้ — ไม่โชว์แถวพวกนั้น
    const hasSplit = o && o['สิ้นเดือนส่งทั้งหมด'] !== undefined;
    const debt = (!isC && o) ? `
      <div class="loctitle" style="margin-top:14px">กับครัวกลาง</div>
      <table><tbody>
        <tr><td>รับของไปแล้ว${o['ตั้งยอดครัวกลาง'] > 0 ? ` <small>รวมของที่ส่งไปแต่ไม่ได้ลง (ตั้งยอดครัวกลาง) ${baht(o['ตั้งยอดครัวกลาง'])}</small>` : ''}</td>
            <td class="num">${baht(o['ส่งไปแล้ว'])}</td></tr>
        <tr><td>คืนค่าของแล้ว</td><td class="num">${baht(o['จ่ายคืนแล้ว'])}</td></tr>
        ${o['ควรจ่าย'] !== undefined ? `
        <tr><td><b>ควรจ่าย</b> <small>ของที่ขาย/เสียไปแล้ว ยังไม่ได้จ่าย${
              o['จ่ายได้เลย'] < o['ควรจ่าย'] - 0.005 ? ' · เงินในมือพอจ่าย ' + baht(o['จ่ายได้เลย']) : ''}</small></td>
            <td class="num ${o['ควรจ่าย'] > 0 ? 'low' : ''}"><b>${baht(o['ควรจ่าย'])}</b></td></tr>
        <tr><td>ค้างชำระ <small>ของจากครัวกลางที่ยังอยู่ในร้าน ยังไม่ได้จ่าย</small></td>
            <td class="num">${baht(o['ค้างในร้าน'])}</td></tr>
        <tr><td>เงินในมือ <small>ขายได้ − ค่าใช้จ่าย − ที่โอนเข้าครัวกลางแล้ว</small></td>
            <td class="num">${baht(o['เงินในมือ'])}</td></tr>` : `
        <tr><td>ค้างชำระ</td><td class="num">${baht(o['ค้างชำระ'])}</td></tr>
        <tr><td>เงินในมือ <small>ขายได้ − ค่าใช้จ่าย − ที่โอนเข้าครัวกลางแล้ว</small></td>
            <td class="num">${baht(o['เงินในมือ'])}</td></tr>
        <tr><td><b>จ่ายได้เลย</b></td><td class="num"><b>${baht(o['จ่ายได้เลย'])}</b></td></tr>`}
        ${hasSplit ? `<tr><td><b>สิ้นเดือน ส่งเข้าครัวกลางทั้งหมด</b>
            <small>${!(o['กำไรที่ส่งได้'] > 0) ? 'ยังไม่มีกำไรให้ส่ง'
              : o['สิ้นเดือนส่งทั้งหมด'] - o['กำไรที่ส่งได้'] > 0.005
              ? 'คืนค่าของ ' + baht(o['สิ้นเดือนส่งทั้งหมด'] - o['กำไรที่ส่งได้']) + ' + กำไร ' + baht(o['กำไรที่ส่งได้'])
              : 'เป็นกำไรทั้งหมด (ไม่มีหนี้ค่าของค้าง)'}</small></td>
            <td class="num"><b>${baht(o['สิ้นเดือนส่งทั้งหมด'])}</b></td></tr>
        <tr><td>ส่งกำไรเข้าครัวกลางแล้ว</td><td class="num">${baht(o['ส่งกำไรแล้ว'])}</td></tr>` : ''}
      </tbody></table>` : '';

    // ครัวกลาง: ของที่นับแล้วหายไป (ค่าใช้จ่ายครัวกลาง)
    const inKitchen = (isC && p && p['ใช้ไปในครัว']) || [];
    // เงินหมุนเวียนครัวกลาง (cash cycle): ซื้อของ → ส่งสาขา → สาขาคืนเงิน → ซื้อรอบใหม่
    const cb = isC && p && p['เงินหมุนเวียน'];
    const days = n => n == null ? '–' : '~' + n + ' วัน';
    const cashCycle = cb ? `
      <div class="loctitle" style="margin-top:14px">💵 เงินหมุนเวียนครัวกลาง <small>ตั้งแต่ ${esc(cb['ตั้งแต่'])}</small></div>
      <table><tbody>
        <tr><td>+ เงินทุนที่ใส่ <small>ถอนออกหักแล้ว · ไลน์: ใส่ทุน / ถอนเงิน</small></td><td class="num">${baht(cb['เงินทุน'])}</td></tr>
        <tr><td>+ สาขาคืนค่าของ</td><td class="num">${baht(cb['รับคืนค่าของ'])}</td></tr>
        <tr><td>+ สาขาส่งกำไร</td><td class="num">${baht(cb['รับกำไร'])}</td></tr>
        <tr><td>− ซื้อของเข้าครัวกลาง${cb['ลองสูตร'] ? ` <small>รวมลองสูตร ${baht(cb['ลองสูตร'])}</small>` : ''}${cb['ยอดยกมา'] ? ` <small>รวมของที่มีก่อนเริ่มนับ ${baht(cb['ยอดยกมา'])}</small>` : ''}</td>
            <td class="num">${baht(cb['ซื้อของ'] + cb['ลองสูตร'])}</td></tr>
        <tr><td>− ค่าใช้จ่ายครัวกลาง</td><td class="num">${baht(cb['ค่าใช้จ่าย'])}</td></tr>
        <tr><td><b>= เงินคงเหลือ</b>${cb['คงเหลือ'] < 0 ? ' <small>ติดลบ = ควักเงินเพิ่มไปแล้วแต่ยังไม่ได้ลงเป็นทุน</small>' : ''}</td>
            <td class="num ${cb['คงเหลือ'] < 0 ? 'low' : ''}"><b>${baht(cb['คงเหลือ'])}</b></td></tr>
        <tr><td>+ จมอยู่ในของที่ครัวกลาง</td><td class="num">${baht(cb['ของในครัวกลาง'])}</td></tr>
        <tr><td>+ สาขายังค้างจ่าย</td><td class="num">${baht(cb['สาขาค้างจ่าย'])}</td></tr>
        <tr><td><b>= ทุนหมุนเวียนทั้งหมด</b></td><td class="num"><b>${baht(cb['ทุนหมุนเวียน'])}</b></td></tr>
        <tr><td><b>รอบเงิน</b> <small>ของอยู่ครัวกลาง ${days(cb['วันของอยู่ครัวกลาง'])} + รอสาขาจ่าย ${days(cb['วันรอสาขาจ่าย'])} ·
            ส่งของเฉลี่ยวันละ ${baht(cb['ส่งของต่อวัน'])}</small></td>
            <td class="num"><b>${days(cb['รอบเงิน'])}</b></td></tr>
      </tbody></table>` : '';
    const centralBook = inKitchen.length ? `
      <div class="loctitle" style="margin-top:14px">ของที่ใช้ในครัวกลาง</div>
      <table><tbody>
        <tr><td>− ของที่ใช้ไปในครัวกลาง <small>ของเสีย + นับแล้วหายไป = ค่าใช้จ่ายครัวกลาง ·
            เจอของที่ลงของเสียไว้ → แท็บของเสีย กด ↩️ คืน</small></td>
            <td class="num">${baht(inKitchen.reduce((a, x) => a + x.value, 0))}</td></tr>
        ${inKitchen.map(x => `<tr><td><small>· ${esc(x.item)}${itemOf(x.item) ? ' ' + esc(fmtPack(x.qty, itemOf(x.item))) : ''}</small></td>
            <td class="num"><small>${baht(x.value)}</small></td></tr>`).join('')}
      </tbody></table>` : '';

    // โชว์ครบทุกรายการ — เดิมตัดไว้ 12 แถว แล้วดูเหมือนของหายไป
    // จำนวนแบบเดียวกับแท็บสต็อกคงเหลือ (แพ็ค/ไม้/ชิ้น) ต้นทุนบอกหน่วยด้วย
    // คิดจากรายการสินค้าในหน้านี้เองด้วย — หลังบ้านเวอร์ชันเก่าส่งมาแค่เลขหน่วยเล็กสุด (ชิ้น)
    // ต้นทุนบอกต่อหน่วยที่ขาย (ไม้) เต้าชีส 2.88/ชิ้น → 5.77/ไม้
    const top = st.rows.map(r => {
      const it = itemOf(r.item);
      const text = it ? fmtPack(r.qty, it) : (r.text || String(r.qty));
      const per = it ? perStickOf(it) : 1;
      const unit = r.unitSub != null ? r.unitSub
        : per > 1 ? (r.qty > 0 ? r.value / r.qty * per : r.unit * per) : r.unit;
      const u = it ? it.subUnit : (r.subUnit || r.baseUnit || '');
      return `<tr>
        <td>${esc(r.item)}</td>
        <td class="num">${esc(text)}</td>
        <td class="num">${baht(unit)}${u ? '<small>/' + esc(u) + '</small>' : ''}</td>
        <td class="num">${baht(r.value)}</td>
      </tr>`;
    }).join('');

    return `<div class="card">
      <div class="loctitle"><span class="pill">${esc(loc)}</span>
        <small>วัตถุดิบคงเหลือ ${baht(st.total)} บาท</small></div>
      ${money}${debt}${cashCycle}${centralBook}
      <div class="loctitle" style="margin-top:14px">ของที่มีอยู่</div>
      <table>
        <thead><tr><th>สินค้า</th><th class="num">คงเหลือ</th>
          <th class="num">ต้นทุน/หน่วย</th><th class="num">มูลค่า</th></tr></thead>
        <tbody>${top || '<tr><td colspan="4" class="empty">ไม่มีของ</td></tr>'}</tbody>
      </table>
      <p class="note">${st.rows.length} รายการ</p>
    </div>`;
  }).join('');

  const warn = M.warn.length ? `<div class="card"><div class="warnbox" style="margin:0">
      ⚠️ ตัวเลขยังไม่สมบูรณ์ ${M.warn.length} จุด<br>
      ${M.warn.slice(0, 6).map(w => `• ${esc(w.loc)} · ${esc(w.item)} — ${esc(w.msg)}`).join('<br>')}
      ${M.warn.length > 6 ? '<br>…' : ''}
    </div></div>` : '';

  const tabBtn = (z, label) => `<button class="key" style="${MONEY_BIZ === z ? '' : 'opacity:.45'}"
      onclick="MONEY_BIZ='${z}';render()">${label}</button>`;
  v.innerHTML = `<div class="card">
      <h2>💰 บัญชี · ${isBk ? 'เบเกอรี่' : isAll ? 'รวมหม่าล่า + เบเกอรี่' : 'หม่าล่า'}</h2>
      <p class="lead">คิดสดจากของที่เคลื่อนไหวจริง แบบเข้าก่อนออกก่อน ·
         ครัวกลางส่งต่อที่ต้นทุน${isBk ? ' · ต้นทุนไดฟุกุ 6.5 บราวนี่ 6 ต่อชิ้น' : ' · ค่าไม้เสียบเป็นค่าใช้จ่ายหม่าล่าของสาขา'} ·
         สิ้นเดือนสาขาส่งเงินทั้งหมดเข้าครัวกลาง (คืนค่าของ + กำไร)</p>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        ${MONEY.total ? tabBtn('รวม', '📊 รวม') : ''}${tabBtn('หม่าล่า', '🌶️ หม่าล่า')}${MONEY.bakery ? tabBtn('เบเกอรี่', '🍡 เบเกอรี่') : ''}
        <button class="key" onclick="MONEY=null;render()">🔄 โหลดใหม่</button>
      </div>${MONEY_AT ? `<p class="note" style="margin-top:6px">ตัวเลข ณ ${String(MONEY_AT.getHours()).padStart(2, '0')}:${String(MONEY_AT.getMinutes()).padStart(2, '0')} น.</p>` : ''}
    </div>${isBk ? '' : warn}${cards || '<div class="card"><div class="empty">ยังไม่มีข้อมูล</div></div>'}`;
}

/**
 * ของหาย (15/10) — เงินที่ควรได้ตามของที่ออกจากร้าน แต่ไม่ได้ ไม่รู้ว่าของอะไร
 * ไม่หักซ้ำ: รายได้ได้น้อยลงเท่านี้อยู่แล้ว · ทุนอยู่ในค่าใช้จ่ายวัตถุดิบ สาขาจ่ายครัวกลางเต็ม
 */
function lostRow(L, isAll) {
  if (!L) return '';
  const lost = Number(L['บาท']) || 0;
  const split = isAll && (L['หม่าล่า'] || L['เบเกอรี่']) ? ` · หม่าล่า ${baht(L['หม่าล่า'])} · เบเกอรี่ ${baht(L['เบเกอรี่'])}` : '';
  return `
        <tr><td>${lost > 0 ? '⚠️ ' : ''}ของหาย <small style="color:var(--muted)">${esc(L['ตั้งแต่'])}–${esc(L['ถึง'])} ·
            ควรได้ ${baht(L['ควรได้'])} ได้จริง ${baht(L['ได้จริง'])}${split}<br>
            ไม่รู้ว่าของอะไร · ไม่ได้หักซ้ำ (รายได้น้อยลงเท่านี้แล้ว) · ทุนอยู่ในค่าวัตถุดิบ สาขาจ่ายครัวกลางเต็ม</small></td>
            <td class="num ${lost > 0 ? 'low' : ''}">${lost > 0 ? baht(lost) : '0.00 ✅'}</td></tr>`;
}

/**
 * แถว "ค่าใช้จ่ายอื่น" — กดแล้วกางดูทีละรายการ แยกตามประเภท (ล่าสุดอยู่บน)
 * หลังบ้านเก่าไม่ส่งรายการมา = แถวเดียวกดไม่ได้เหมือนเดิม
 */
function expenseRows(p, id) {
  const list = p['รายการค่าใช้จ่าย'] || [];
  if (!list.length) {
    return `<tr><td>− ค่าใช้จ่ายอื่น</td><td class="num">${baht(p['ค่าใช้จ่ายอื่น'])}</td></tr>`;
  }
  const byType = {};
  list.forEach(e => { (byType[e['ประเภท']] = byType[e['ประเภท']] || []).push(e); });
  const sum = a => a.reduce((t, e) => t + (Number(e['บาท']) || 0), 0);
  const types = Object.keys(byType).sort((a, b) => sum(byType[b]) - sum(byType[a]));
  const rows = types.map(t => `
        <tr class="${id} hidden"><td><small><b>${esc(t)}</b> · ${byType[t].length} รายการ</small></td>
            <td class="num"><small><b>${baht(sum(byType[t]))}</b></small></td></tr>` +
    byType[t].map(e => {
      const note = e['รายละเอียด'] ? ' ' + esc(e['รายละเอียด']) : '';
      const pay = e['วิธีจ่าย'] ? ` <span style="color:var(--muted)">${esc(e['วิธีจ่าย'])}</span>` : '';
      return `
        <tr class="${id} hidden"><td><small>&nbsp;&nbsp;· ${esc(e['เวลา'])}${note}${pay}</small></td>
            <td class="num"><small>${baht(e['บาท'])}</small></td></tr>`;
    }).join('')).join('');
  return `<tr onclick="toggleRows('${id}', this)" style="cursor:pointer">
        <td>− ค่าใช้จ่ายอื่น <small class="caret">▸ กดดู ${list.length} รายการ</small></td>
        <td class="num">${baht(p['ค่าใช้จ่ายอื่น'])}</td></tr>${rows}`;
}

function toggleRows(cls, el) {
  const rows = document.querySelectorAll('.' + cls);
  if (!rows.length) return;
  const open = rows[0].classList.contains('hidden');
  rows.forEach(r => r.classList.toggle('hidden', !open));
  const c = el && el.querySelector('.caret');
  if (c) c.textContent = (open ? '▾ ซ่อน ' : '▸ กดดู ') + c.textContent.replace(/^[▸▾]\s*(กดดู|ซ่อน)\s*/, '');
}

async function loadMoney() {
  try {
    MONEY = (await apiGet({ action: 'costBoard' })).data;
    MONEY_AT = new Date();
    if (tab === 'money') render();
  } catch (e) {
    document.getElementById('view').innerHTML =
      `<div class="card"><div class="warnbox" style="margin:0">❌ ${esc(e.message)}</div></div>`;
  }
}

/* ── สต็อกคงเหลือ ── */
function viewStock(v) {
  const blocks = D.stock.map(L => {
    // บอกวันนับล่าสุดเสมอ — ของที่นับได้ 0 ไม่ขึ้นในตาราง
    // ถ้าไม่บอก จะแยกไม่ออกว่า "นับแล้วไม่มีของ" กับ "ยังไม่ได้นับเลย"
    const cnt = L.counted
      ? `<small style="color:var(--muted);font-weight:400">นับล่าสุด ${esc(L.counted.when)} · ${L.counted.n} รายการ</small>`
      : `<small style="color:var(--amber);font-weight:400">ยังไม่เคยนับสต็อกที่นี่</small>`;
    if (!L.rows.length) {
      return `<div class="locblock"><div class="loctitle"><span class="pill">${esc(L.name)}</span>${cnt}</div>
              <div class="empty">${L.counted ? 'นับแล้ว ไม่มีของเหลือ' : 'ยังไม่มีของในสต็อก'}</div></div>`;
    }
    const rows = L.rows.map(r => `<tr>
        <td>${esc(r.item)}</td>
        <td class="num${r.low ? ' low' : ''}">${esc(r.text)}${r.low ? ' ⚠️' : ''}</td>
      </tr>`).join('');
    return `<div class="locblock">
      <div class="loctitle"><span class="pill">${esc(L.name)}</span>${cnt}</div>
      <table><tbody>${rows}</tbody></table>
    </div>`;
  }).join('');

  v.innerHTML = `<div class="card">
    <h2>📦 สต็อกคงเหลือ</h2>
    <p class="lead">ยอดล่าสุดจากการนับครั้งหลังสุด บวกของเข้า ลบของเสีย</p>
    ${blocks || '<div class="empty">ยังไม่มีข้อมูล</div>'}
    <p class="note">⚠️ = ต่ำกว่าจุดเตือนที่ตั้งไว้ในชีตรายการสินค้า · ของที่เหลือ 0 ไม่ขึ้นในตาราง</p>
  </div>`;
}

            action: 'stockIn', btn: 'บันทึกของเข้า', fixedLoc: true },
  toshop: { title: '🏪 ของเข้าร้าน', lead: 'รับของที่ครัวกลางส่งมา ระบบหักออกจากครัวกลางให้อัตโนมัติ',
            action: 'stockToShop', btn: 'บันทึกของเข้าร้าน', branchOnly: true },
  waste:  { title: '🗑️ ของเสีย', lead: 'ของที่ทิ้ง ระบบจะตัดออกจากสต็อกให้ · ของแช่แข็งละลายแล้วหายไปเท่าไหร่ ตัดที่นี่ (เลือกสาเหตุ น้ำแข็ง/ละลาย)',
            action: 'stockWaste', btn: 'บันทึกของเสีย', reason: true }
};

      </div>

      <div>
        <label class="fld" id="lbl-rem" style="margin-top:0">เศษ</label>
        <input id="f-rem" type="number" inputmode="decimal" min="0" step="any" placeholder="0" oninput="recalc()" onblur="carryMove()">
      </div>

      </div>

      <label class="fld">วันเข้า (ไดฟุกุ — นับอายุ 30 วันจากวันนี้)</label>

        <option>น้ำแข็ง/ละลาย</option><option>เศษตัดแต่ง</option>

      </select>` : ''}

    <button class="key btn-red submit" id="f-btn" onclick="submitMove('${kind}')">${c.btn}</button>
    <p class="note" id="f-note-line"></p>
  </div>${kind === 'waste' && isOwner() ? `
  <div class="card">
    <h2>↩️ คืนของเสีย</h2>
    <p class="lead">ลงของเสียไปแล้วเจอของ หรือลงผิด — กดคืน ยอดกลับเข้าสต็อก และบัญชีไม่นับเป็นของเสีย
       (ย้อนหลัง 14 วัน · ที่เลือกไว้ข้างบน)</p>

/* ── คืนของเสีย (15/10) — เจอของที่ลงของเสียไว้ · เจ้าของเท่านั้น ── */
const WU = { loc: '', rows: null, arm: -1, busy: -1 };
async function loadWasteList() {
  const locEl = document.getElementById('f-loc');
  const loc = locEl ? locEl.value : D.central;
  Object.assign(WU, { loc, rows: null, arm: -1, busy: -1 });
  renderWasteList();
  try {
    const r = await apiGet({ action: 'wasteList', location: loc });
    if (WU.loc === loc) { WU.rows = r.data || []; renderWasteList(); }
  } catch (e) {
    const el = document.getElementById('wu-list');
    if (el) el.innerHTML = /เวอร์ชันเก่า|ไม่รู้จัก action/.test(e.message)
      ? '<p class="note">ต้องวาง pos-backend.gs รุ่นใหม่ แล้ว Deploy ก่อน ถึงจะคืนของเสียได้</p>'
      : '<p class="note">❌ ' + esc(e.message) + '</p>';
  }
}
function renderWasteList() {
  const el = document.getElementById('wu-list');
  if (!el) return;
  if (!WU.rows) { el.innerHTML = '<div class="empty">กำลังโหลด…</div>'; return; }
  if (!WU.rows.length) { el.innerHTML = '<div class="empty">ไม่มีของเสียที่ลงไว้ใน 14 วันที่ผ่านมา</div>'; return; }
  const b = (label, js, red) => `<button class="key${red ? ' btn-red' : ''}" style="display:inline-block;width:auto;padding:4px 10px;margin:2px 0 0;font-size:13px"
      onclick="${js}">${label}</button>`;
  el.innerHTML = '<table><tbody>' + WU.rows.map((x, i) => `
    <tr><td><small style="color:var(--muted)">${esc(x.when)}${x.reason ? ' · ' + esc(x.reason) : ''}${x.by ? ' · ' + esc(x.by) : ''}</small><br>
        ${esc(x.item)} <b>${esc(x.text)}</b></td>
      <td class="num" style="white-space:nowrap">${
        WU.busy === i ? '⏳' :
        WU.arm === i ? b('ยืนยันคืน', `wasteUndoGo(${i})`, true) + '<br>' + b('ยกเลิก', 'WU.arm=-1;renderWasteList()') :
        b('↩️ คืน', `WU.arm=${i};renderWasteList()`)}</td></tr>`).join('') + '</tbody></table>';
}
async function wasteUndoGo(i) {
  const x = WU.rows && WU.rows[i];
  if (!x || WU.busy >= 0) return;
  WU.busy = i; WU.arm = -1; renderWasteList();
  try {
    const r = await apiPost({ action: 'wasteUndo', location: WU.loc, row: x.row, item: x.item, t: x.t });
    toast('↩️ ' + esc(r.message || 'คืนแล้ว'), 6000);
    WU.rows.splice(i, 1);
    refreshInBackground();
  } catch (e) {
    if (/เวอร์ชันเก่า|ไม่รู้จัก action/.test(e.message)) toastApiError(e.message);
    else toast('❌ ' + esc(e.message), 8000);
  } finally {
    WU.busy = -1; renderWasteList();
  }
}

/** เติมรายการสินค้าในช่องเลือก ตามสถานที่ที่เลือกอยู่ */
function fillItems() {
  const sel = document.getElementById('f-item');
  if (!sel) return;
  const locEl = document.getElementById('f-loc');
  const loc = locEl ? locEl.value : D.central;
  const keep = sel.value;
  // ของเข้าร้าน/ของเสีย เลือกได้แต่ของที่แพ็คแล้ว วัตถุดิบอยู่แค่ในแท็บแพ็คของ
  const list = tab === 'in'    ? buyItems(loc)
             : tab === 'waste' ? wasteItems(loc)
             : packedItems(loc);
  fillSelect('f-item', 'f-find', list);
  syncUnits();
}

/**
 * ช่องค้นหาคู่กับช่องเลือก — ลิสต์ยาวเป็นร้อยรายการ เลื่อนหาไม่ไหว
 * เทียบแบบตัดช่องว่างกับวงเล็บออก พิมพ์ "ติดมัน" ก็เจอ
 * "หมูติดมันสไลซ์" ไม่ต้องพิมพ์ให้ตรงเป๊ะ
 * พิมพ์แล้วไม่เจอเลย เอาทั้งลิสต์กลับมา ดีกว่าปล่อยช่องว่างจนงง
 */
// ชื่อที่เรียกกันอีกแบบ — พิมพ์ค้นด้วยชื่อนี้ก็เจอ
// "เห็ดเข็มทอง" → เจอทั้งเห็ดเข็ม (ถุง) และหมูพันเห็ดเข็มทอง — ในระบบเห็ดเปล่าชื่อ "เห็ดเข็ม"
const FIND_ALIAS = { 'นมสด': 'ครีมนม', 'เห็ดเข็มทอง': 'เห็ดเข็ม', 'นางรมหลวง': 'ออเร็นจิ', 'ออรินจิ': 'ออเร็นจิ', 'สไลด์': 'สไลซ์',
  'สตรอว์เบอร์รี': 'สตอเบอร์รี่', 'สตรอเบอร์รี่': 'สตอเบอร์รี่', 'สตรอเบอรี่': 'สตอเบอร์รี่', 'สตอเบอรี่': 'สตอเบอร์รี่',
  'อัลมอนด์': 'อัลม่อน' };
function matchFind(name, q) {
  const k = x => String(x).toLowerCase().replace(/[\s()]/g, '');
  if (!q) return true;
  let kq = k(q);
  Object.keys(FIND_ALIAS).forEach(a => { kq = kq.replace(k(a), k(FIND_ALIAS[a])); });
  return k(name).indexOf(kq) !== -1;
}
function fillSelect(selId, findId, list) {
  const sel = document.getElementById(selId);
  if (!sel) return;
  const findEl = document.getElementById(findId);
  const q = findEl ? findEl.value.trim() : '';
  const keep = sel.value;
  let use = list.filter(i => matchFind(i.name, q));
  const miss = !!q && !use.length;
  if (miss) use = list;
  sel.innerHTML = use.length
    ? use.map(i => `<option value="${esc(i.name)}">${esc(i.name)}</option>`).join('')
    : '<option value="">— ไม่มีสินค้าสำหรับที่นี่ —</option>';
  if (keep && use.some(i => i.name === keep)) sel.value = keep;
  const hint = document.getElementById(findId + '-n');
  if (hint) {
    hint.textContent = !q ? ''
      : miss ? 'ไม่เจอ "' + q + '" — แสดงทั้งหมด ' + use.length + ' รายการ'
      : 'เจอ ' + use.length + ' รายการ';
  }
}

function syncUnits() {
  const it = itemOf(document.getElementById('f-item').value);
  if (!it) return;
  // ไดฟุกุรับเข้าครัวกลาง ต้องกรอกวันเข้า (นับอายุจากวันนั้น ไม่ใช่วันที่ลงระบบ)
  const ws = document.getElementById('wrap-start');
  if (ws) {
    const need = tab === 'in' && /^ไดฟุกุ/.test(it.name);
    ws.classList.toggle('hidden', !need);
    const sd = document.getElementById('f-start');
    if (need && !sd.value) sd.value = new Date(Date.now() + 7 * 3600000).toISOString().slice(0, 10);
  }
  document.getElementById('lbl-packs').textContent = it.packUnit;
  document.getElementById('lbl-rem').textContent = 'เศษ (' + it.subUnit + ')';
  // ลูกชิ้นเสียบไม้ละหลายชิ้น ต้องมีช่องกรอกลูกที่ยังไม่ได้เสียบ
  const wp = document.getElementById('wrap-pieces');
  if (wp) {
    const locEl = document.getElementById('f-loc');
    const loc = locEl ? locEl.value : D.central;
    // ของเสียที่สาขานับแค่แพ็คกับไม้ เหมือนตอนเช็คสต็อก
    const showPc = hasPieces(it) && !(tab === 'waste' && !piecesAt(loc));
    wp.classList.toggle('hidden', !showPc);
    if (!showPc) document.getElementById('f-pieces').value = '';
    if (showPc) document.getElementById('lbl-pieces').textContent =
           'เศษ (ชิ้น) — ' + perStickOf(it) + ' ชิ้น = 1 ' + it.subUnit;
  }
  const pk = document.getElementById('f-packs');
  if (it.perPack <= 1) { pk.value = ''; pk.disabled = true; } else { pk.disabled = false; }
}

/** ทดหน่วยในฟอร์มของเข้า/ส่งร้าน/ของเสีย */
function carryMove() {
  const it = itemOf(document.getElementById('f-item').value);
  if (carryUnits(document.getElementById('f-packs'),
                 document.getElementById('f-rem'),
                 document.getElementById('f-pieces'), it)) recalc();
}

function recalc() {
  const box = document.getElementById('calc');
  if (!box) return;
  const it = itemOf(document.getElementById('f-item').value);
  if (!it) { box.innerHTML = ''; return; }

  const pcEl = document.getElementById('f-pieces');
  const total = toBase(document.getElementById('f-packs').value,
                       document.getElementById('f-rem').value,
                       pcEl ? pcEl.value : 0, it);
  const locEl = document.getElementById('f-loc');
  const loc = locEl ? locEl.value : D.central;
  // ของเข้าร้านตัดจากครัวกลาง ที่เหลือตัด/บวกที่สถานที่นั้น
  const from = (tab === 'toshop') ? D.central : loc;
  const have = balOf(from, it.name);
  const after = (tab === 'in') ? have + total : have - total;

  if (!(total > 0)) {
    box.innerHTML = isOwner()
      ? `<div class="sub">กรอกจำนวน — ตอนนี้ ${esc(from)} มี <b>${esc(fmtPack(have, it))}</b></div>`
      : '<div class="sub">กรอกจำนวน</div>';
    return;
  }
  // ยอดคงเหลือเป็นข้อมูลของเจ้าของร้าน พนักงานเห็นแค่ผลแปลงหน่วยของที่ตัวเองกำลังกรอก
  const over = (tab !== 'in') && after < 0;
  box.innerHTML =
    `<div class="big">${esc(fmtPack(total, it))}</div>` +
    // ยอดรวมเป็นหน่วยเล็กสุด — ของที่ไม้/ชุดหนึ่งมีหลายชิ้น (เต้าชีส ไดฟุกุ) หน่วยเล็กสุดคือชิ้น/ลูก ไม่ใช่ไม้/ชุด
    (it.perPack > 1 || perStickOf(it) > 1 ? `<div class="sub">= ${total} ${esc(perStickOf(it) > 1 ? (/^ไดฟุกุ/.test(it.name) ? 'ลูก' : 'ชิ้น') : it.subUnit)}` +
      ` (1 ${esc(it.packUnit)} = ${it.perPack} ${esc(it.subUnit)}` +
      (perStickOf(it) > 1 ? ` · 1 ${esc(it.subUnit)} = ${perStickOf(it)} ${/^ไดฟุกุ/.test(it.name) ? 'ลูก' : 'ชิ้น'}` : '') + ')</div>' : '') +
    (isOwner()
      ? `<div class="sub">${esc(from)} ${esc(fmtPack(have, it))} → เหลือ <b>${esc(fmtPack(after, it))}</b>` +
        (over ? ' <span class="low">⚠️ มากกว่าที่มีในสต็อก</span>' : '') + '</div>'
      : '');
}

async function submitMove(kind) {
  const c = MOVE[kind];
  const it = itemOf(document.getElementById('f-item').value);
  if (!it) return toast('เลือกสินค้าก่อน');
  const packs = document.getElementById('f-packs').value;
  const rem   = document.getElementById('f-rem').value;
  const pcEl2 = document.getElementById('f-pieces');
  const pieces = pcEl2 ? pcEl2.value : '';
  if (!(toBase(packs, rem, pieces, it) > 0)) return toast('กรอกจำนวนก่อน');
  const ws = document.getElementById('wrap-start');
  const start = ws && !ws.classList.contains('hidden') ? document.getElementById('f-start').value : '';
  if (ws && !ws.classList.contains('hidden') && !start) return toast('กรอกวันเข้าของไดฟุกุก่อน');

  const locEl = document.getElementById('f-loc');
  const btn = document.getElementById('f-btn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner-sm"></span> กำลังบันทึก...';
  try {
    const payload = {
      action: c.action, item: it.name, location: locEl ? locEl.value : D.central,
      packs: packs, rem: rem, pieces: pieces,
      reason: c.reason ? document.getElementById('f-reason').value : '',
      note: document.getElementById('f-note').value, start: start
    };
    const r = await apiPost(Object.assign({ reqId: reqIdFor('move', payload) }, payload));
    reqDone('move');
    toast('บันทึกแล้ว ✅ ' + esc(r.text) + '<br><span style="opacity:.8;font-size:12.5px">' +
          esc(r.lineSent ? 'แจ้งกลุ่มไลน์แล้ว' : (r.lineMsg || '')) + '</span>' + dupNote(r), r.duplicated ? 7000 : 4500);
    document.getElementById('f-packs').value = '';
    document.getElementById('f-rem').value = '';
    if (pcEl2) pcEl2.value = '';
    document.getElementById('f-note').value = '';
    btn.disabled = false;
    btn.innerHTML = c.btn;
    refreshInBackground(recalc);
    return;
  } catch (e) {
    if (/เวอร์ชันเก่า/.test(e.message)) toastApiError(e.message);
    else toast('❌ ' + esc(e.message), 6000);
  }
  btn.disabled = false;
  btn.innerHTML = c.btn;
}

/* ── แพ็คของ — ตัดของดิบ เพิ่มของที่แพ็คแล้ว ── */

/** ของแพ็คที่ครัวกลางทำได้ */
// เบเกอรี่กับของพร้อมส่ง (ฟองเต้าหู้ม้วน) ไม่ต้องแพ็ค
const packOutputs = () => packedItems(D.central).filter(i => !i.bakery && !i.ready);

/**
 * กรอกเศษเกินหนึ่งแพ็ค ให้ทดขึ้นไปเป็นแพ็คให้เลย
 * พิมพ์ "20 ไม้" ในช่องเศษ → กลายเป็น 2 แพ็ค 0 ไม้
 *
 * ทดตอนออกจากช่อง (blur) ไม่ใช่ตอนพิมพ์ — ถ้าทดทุกตัวอักษร
 * พอพิมพ์ "2" ของ "25" มันจะกระโดดไปก่อนแล้วพิมพ์ต่อไม่ได้
 * ยอดรวมไม่เปลี่ยน แค่เขียนให้อ่านง่ายขึ้น
 */
function carryUnits(pEl, rEl, cEl, it) {
  if (!it || !rEl) return false;
  let moved = false;
  const perStick = perStickOf(it);
  // ชิ้นครบไม้ → ทดเป็นไม้ก่อน
  if (cEl && !cEl.disabled && perStick > 1) {
    const pieces = Number(cEl.value) || 0;
    if (pieces >= perStick) {
      rEl.value = (Number(rEl.value) || 0) + Math.floor(pieces / perStick);
      cEl.value = pieces % perStick;
      moved = true;
    }
  }
  // ไม้ครบแพ็ค → ทดเป็นแพ็ค
  if (pEl && !pEl.disabled && it.perPack > 1) {
    const rem = Number(rEl.value) || 0;
    if (rem >= it.perPack) {
      pEl.value = (Number(pEl.value) || 0) + Math.floor(rem / it.perPack);
      // เลขทศนิยม (ของชั่งเป็นโล) เหลือเศษให้ปัดตามเดิม ไม่ให้ 0.1+0.2 เพี้ยน
      rEl.value = Math.round((rem % it.perPack) * 1000) / 1000;
      moved = true;
    }
  }
  return moved;
}

/** ของดิบที่ต้องใช้ทำของตัวนี้ — ของที่แค่เสียบไม้จะมีตัวเดียว คือของดิบชื่อเดียวกัน */
/* กลุ่มวัตถุดิบ — "@เนื้อหมู" แปลว่าให้เลือกเอาเองว่าใช้หมูอะไร
   ของที่พันไม่ได้ใช้หมูชิ้นเดิมทุกครั้ง แล้วแต่วันนั้นมีอะไร */
const GROUP_MARK = '@';
const isGroup = n => String(n).charAt(0) === GROUP_MARK;
const groupName = n => String(n).slice(1);
/** ตัวเลือกในกลุ่ม — เอาเฉพาะของดิบที่มีอยู่จริงในชีต */
function groupChoices(n) {
  const g = (D.rawGroups || {})[groupName(n)] || [];
  return g.map(x => itemOf(x)).filter(Boolean);
}

/**
 * ของดิบที่ต้องกรอกเอง — ไม่รวมตัวที่ผูกอัตราส่วนไว้แล้ว
 * กลุ่มคืนเป็น { group: '@เนื้อหมู', choices: [...] } ให้ทำเป็นช่องเลือก
 */
function rawsOf(it) {
  if (!it || !it.raws) return [];
  const auto = it.autoRaws || {};
  return it.raws.filter(n => !auto[n]).map(n => {
    if (!isGroup(n)) return itemOf(n);
    const choices = groupChoices(n);
    return choices.length ? { group: n, choices: choices, name: groupName(n),
                              subUnit: choices[0].subUnit } : null;
  }).filter(Boolean);
}

/** ของที่ตัดเองอัตโนมัติ เช่นถ้วย 1 ใบต่อ 1 กระปุก — โชว์ให้เห็น แต่ไม่ต้องกรอก */
function autoRawsOf(it) {
  const auto = (it && it.autoRaws) || {};
  return Object.keys(auto).map(n => ({ item: itemOf(n), per: auto[n] }))
    .filter(x => x.item);
}

      '</b> ยังไม่ได้ตั้งว่าไม้ละกี่ชิ้น<br>' +

  // ไม่ต้องให้เลือกเองว่าใช้อะไร เพราะสูตรตั้งไว้ในชีตแล้ว (คอลัมน์ "วัตถุดิบ")
  // ของที่ตัดตามจำนวนที่ได้ ไม่ต้องถาม บอกให้รู้ว่าระบบจะตัดอะไรไปเท่าไหร่
  const autos = autoRawsOf(it);
  const autoNote = autos.length
    ? `<p class="note" style="margin-top:10px">` + autos.map(a =>
        `ตัด <b>${esc(a.item.name)}</b> ให้เอง ${a.per === 1 ? '1' : a.per} ` +
        `${esc(a.item.subUnit)} ต่อ 1 ${esc(it.subUnit)} — ไม่ต้องกรอก`).join('<br>') + `</p>`

      raws.map((r, i) => (r.group
        ? `<div class="note" style="margin-top:6px">ใช้${esc(r.name)}อะไร</div>

        <div class="row2" style="align-items:end">
          <div><div class="sub" id="k-ru-${i}">เอามากี่${esc(r.subUnit)}</div>

          <div><div class="sub">ได้เนื้อเท่าไหร่ — ของแช่แข็ง</div>
            <input id="k-rt-${i}" type="number" inputmode="decimal" min="0" step="any"
                   placeholder="ไม่ใส่ก็ได้" oninput="calcPack()"></div>
        </div>`).join('')
    : (autos.length ? ''
       : '<p class="note">รายการนี้ยังไม่ได้ตั้งของดิบไว้ในชีต — บันทึกได้ แต่จะไม่มีอะไรถูกตัดออก</p>'))

/** ของดิบแต่ละช่อง — กลุ่มเอาตามที่เลือกไว้ ไม่ใช่กลุ่มก็ตัวเดิม */
function packRawAt(it, i) {
  const r = rawsOf(it)[i];
  if (!r) return null;
  if (!r.group) return r;
  const sel = document.getElementById('k-rs-' + i);
  return itemOf(sel ? sel.value : r.choices[0].name) || r.choices[0];
}

/** เปลี่ยนเนื้อที่เลือก หน่วยอาจไม่เหมือนกัน ต้องอัปเดตป้าย */
function syncPackRaw(i) {
  const it = itemOf(document.getElementById('k-out').value);
  const r = packRawAt(it, i);
  const lbl = document.getElementById('k-ru-' + i);
  if (r && lbl) lbl.textContent = 'เอามากี่' + r.subUnit;
}

/** ทดหน่วยในฟอร์มแพ็คของ */
function carryPack() {
  const it = itemOf(document.getElementById('k-out').value);
  if (carryUnits(document.getElementById('k-packs'),
                 document.getElementById('k-rem'),
                 document.getElementById('k-pieces'), it)) calcPack();
}

function calcPack() {
  const box = document.getElementById('k-calc');
  if (!box) return;
  const it = itemOf(document.getElementById('k-out').value);
  if (!it) { box.innerHTML = ''; return; }

  const made = toBase(document.getElementById('k-packs').value,
                      document.getElementById('k-rem').value,
                      document.getElementById('k-pieces').value, it);
  if (!(made > 0)) { box.innerHTML = '<div class="sub">กรอกจำนวนที่แพ็คได้</div>'; return; }

  let html = `<div class="big">${esc(fmtPack(made, it))}</div>`;
  if (it.perPack > 1) {
    html += `<div class="sub">= ${made} ${esc(baseUnitOf(it))} (1 ${esc(it.packUnit)} = ${it.perPack} ${esc(it.subUnit)}` +
            (hasPieces(it) ? ` · 1 ${esc(it.subUnit)} = ${perStickOf(it)} ชิ้น` : '') + ')</div>';
  }

  autoRawsOf(it).forEach(a => {
    const used = Math.round(made * a.per * 1000) / 1000;
    if (isOwner()) {
      const have = balOf(D.central, a.item.name), left = have - used;
      html += `<div class="sub">${esc(a.item.name)} ${esc(fmtPack(have, a.item))} → เหลือ ` +
              `<b>${esc(fmtPack(left, a.item))}</b>` +
              (left < 0 ? ' <span class="low">⚠️ มากกว่าที่มีในสต็อก</span>' : '') + '</div>';
    } else {
      html += `<div class="sub">ตัด ${esc(a.item.name)} ออก ${used} ${esc(a.item.subUnit)}</div>`;
    }
  });

  rawsOf(it).forEach((_, i) => {
    const r = packRawAt(it, i);
    if (!r) return;
    const el = document.getElementById('k-rq-' + i);
    const tEl = document.getElementById('k-rt-' + i);
    // ตัดตามที่เอาออกมาจากสต็อก ส่วน "ได้เนื้อ" เก็บไว้ดู yield ไม่ตัดซ้ำ
    const used = el ? Number(el.value) || 0 : 0;
    const net = tEl ? Number(tEl.value) || 0 : 0;
    if (!(used > 0)) return;
    if (net > used) {
      html += `<div class="sub low">⚠️ ${esc(r.name)} ได้เนื้อ ${net} แต่เอามาแค่ ${used}</div>`;
      return;
    }
    if (net > 0 && net < used) {
      html += `<div class="sub">${esc(r.name)} น้ำแข็ง/เศษทิ้ง ` +
              `<b>${Math.round((used - net) * 1000) / 1000} ${esc(r.subUnit)}</b>` +
              ` · ได้เนื้อ ${Math.round(net / used * 100)}%</div>`;
    }
    // ยอดคงเหลือเป็นข้อมูลของเจ้าของร้าน พนักงานเห็นแค่ผลแปลงหน่วยของที่ตัวเองกรอก
    if (isOwner()) {
      const have = balOf(D.central, r.name), left = have - used;
      html += `<div class="sub">${esc(r.name)} ${esc(fmtPack(have, r))} → เหลือ <b>${esc(fmtPack(left, r))}</b>` +
              (left < 0 ? ' <span class="low">⚠️ มากกว่าที่มีในสต็อก</span>' : '') + '</div>';
    } else {
      html += `<div class="sub">ตัด ${esc(r.name)} ออก ${used} ${esc(r.subUnit)}</div>`;
    }
  });
  box.innerHTML = html;
}

async function submitPack() {
  const it = itemOf(document.getElementById('k-out').value);
  if (!it) return toast('เลือกของที่จะแพ็คก่อน');
  const packs = document.getElementById('k-packs').value;
  const rem    = document.getElementById('k-rem').value;
  const pieces = document.getElementById('k-pieces').value;
  if (!(toBase(packs, rem, pieces, it) > 0)) return toast('กรอกจำนวนที่แพ็คได้ก่อน');

  const raws = [];
  const list = rawsOf(it);
  for (let i = 0; i < list.length; i++) {
    const r = packRawAt(it, i);
    if (!r) continue;
    const el = document.getElementById('k-rq-' + i);
    const tEl = document.getElementById('k-rt-' + i);
    const q = el ? el.value : '';
    const net = tEl ? tEl.value : '';
    // ตัดของดิบไม่ครบ ยอดจะเพี้ยนแบบเงียบ ๆ เลยบังคับกรอกให้ครบทุกช่อง (ช่องว่าง = ลืม)
    // ใส่ 0 เอง = ใช้ของที่เหลือจากรอบก่อน ตัดไปแล้วรอบนั้น (14/10 สาหร่ายแช่ไว้ตั้งแต่ 12/10)
    // ของดิบอย่างเดียวต้องมากกว่า 0 — ใส่ 0 แล้วไม่มีอะไรถูกตัดเลย
    if (String(q).trim() === '' || !(Number(q) >= 0)) return toast('กรอกว่าเอา ' + esc(r.name) + ' มาเท่าไหร่');
    if (!(Number(q) > 0) && list.length < 2) return toast('กรอกว่าเอา ' + esc(r.name) + ' มาเท่าไหร่');
    if (Number(net) > Number(q)) {
      return toast(esc(r.name) + ' ได้เนื้อมากกว่าที่เอามา');
    }
    raws.push({ name: r.name, qty: q, net: net });
  }
  if (raws.length && !raws.some(x => Number(x.qty) > 0)) return toast('ต้องมีของดิบอย่างน้อย 1 อย่างที่มากกว่า 0');

  const btn = document.getElementById('k-btn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner-sm"></span> กำลังบันทึก...';
  try {
    const payload = { action: 'stockPack', item: it.name, packs, rem, pieces, raws,
                      note: document.getElementById('k-note').value };
    const r = await apiPost(Object.assign({ reqId: reqIdFor('pack', payload) }, payload));
    reqDone('pack');
    toast('บันทึกแล้ว ✅ ' + esc(r.text) + '<br><span style="opacity:.8;font-size:12.5px">' +
          esc(r.lineSent ? 'แจ้งกลุ่มไลน์แล้ว' : (r.lineMsg || '')) + '</span>' + dupNote(r), r.duplicated ? 7000 : 4500);
    document.getElementById('k-packs').value = '';
    document.getElementById('k-rem').value = '';
    document.getElementById('k-pieces').value = '';
    document.getElementById('k-note').value = '';
    list.forEach((_, i) => {
      ['k-rq-', 'k-rt-'].forEach(pre => {
        const el = document.getElementById(pre + i); if (el) el.value = '';
      });
    });
    refreshInBackground(calcPack);
  } catch (e) {
    if (/เวอร์ชันเก่า/.test(e.message)) toastApiError(e.message);
    else toast('❌ ' + esc(e.message), 6000);
  }
  btn.disabled = false;
  btn.innerHTML = 'บันทึกการแพ็ค';
}

/* ── เช็คสต็อกรายสัปดาห์ — บังคับนับให้ครบ ── */
/** สินค้าที่ต้องนับที่สถานที่ที่เลือกอยู่ในแท็บเช็คสต็อก */
function countItems() {
  const el = document.getElementById('c-loc');
  const loc = el ? el.value : D.central;
  // สาขานับเบเกอรี่ในแท็บ 🍡 เบเกอรี่ (ก่อนขาย/หลังขาย) ไม่ได้นับตอนปิดร้านหม่าล่า
  return itemsFor(loc).filter(i => loc === D.central || !i.bakery);
}

/* ── 🍡 เบเกอรี่ — สาขานับวันละ 2 รอบ (ก่อนขาย / หลังขาย) หลังขายกรอกเงินที่ได้ ──
   พนักงานไม่เห็นยอดที่ควรได้หรือต้นทุน เห็นแค่ว่าบันทึกแล้ว — ระบบเทียบแล้วแจ้งเจ้าของเอง */
const bakeryItems = () => D.items.filter(i => i.bakery);
let BK_ROUND = 'ก่อนขาย';
let BK_ID = 'BK' + Date.now();       // กันกดซ้ำ/เน็ตหลุดแล้วส่งใหม่ ลงเงินซ้ำ
let BK_LATE = false;                  // หลังขายของเมื่อวาน (ลืมนับ) — ลงย้อนหลัง
let BK_LATE_DAY = '';                 // วันที่ลืม (จากหลังบ้าน) — ว่าง = เมื่อวาน
let BK_LOC = '';                      // สาขาที่เลือกในแท็บเบเกอรี่
let BK_AUTO = false;                  // เปิดแท็บครั้งแรกแล้วเจอวันที่ลืม → เลือกโหมดลงย้อนหลังให้ครั้งเดียว
function bkLateGo(loc) {
  const p = ((D.late || {})[loc] || {}).bakery;
  BK_LOC = loc; BK_ROUND = 'หลังขาย'; BK_LATE = true; BK_LATE_DAY = p ? p.day : ''; BK_AUTO = true;
  go('bakery');
}
/** วันทำการ (ตี 4 ยังเป็นเมื่อวาน เหมือนหลังบ้าน) → 'yyyy-MM-dd' */
function bkBizDay(ms) {
  const d = new Date(ms - 4 * 3600000);
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
const bkYesterday = () => bkBizDay(Date.now() - 86400000);
const bkDM = ymd => { const p = ymd.split('-'); return Number(p[2]) + '/' + Number(p[1]); };
const BK_MONEY = [['cash', 'เงินสด'], ['transfer', 'เงินโอน'], ['thai', 'ไทยช่วยไทย']];

function viewBakery(v) {
  const locs = allowedLocs().filter(l => l !== D.central);
  const items = bakeryItems();
  if (!items.length || !locs.length) {
    v.innerHTML = `<div class="card"><div class="warnbox" style="margin:0">
      ${!items.length ? '⚠️ ยังไม่มีรายการเบเกอรี่ — เจ้าของร้านรัน fixItemList ใน Apps Script หนึ่งครั้ง'
                      : 'นับเบเกอรี่ได้เฉพาะที่สาขา'}</div></div>`;
    return;
  }
  const selLoc = locs.includes(BK_LOC) ? BK_LOC : (locs.includes(auth.branch) ? auth.branch : locs[0]);
  const pend = ((D.late || {})[selLoc] || {}).bakery;
  if (pend && !BK_AUTO) { BK_AUTO = true; BK_ROUND = 'หลังขาย'; BK_LATE = true; BK_LATE_DAY = pend.day; }
  // 13/10 เจ้าของ: ปุ่ม "ลืมนับ" ขึ้นเฉพาะวันที่ลืมจริง (หลังบ้านบอกมา) — เมื่อวานนับแล้วไม่ต้องขึ้น
  // หลังบ้านรุ่นเก่าไม่ส่ง D.late มา = ไม่รู้ ให้เลือกเองได้เหมือนเดิม
  const canLate = !!pend || D.late === undefined;
  if (!canLate) { BK_LATE = false; BK_LATE_DAY = ''; }
  const after = BK_ROUND === 'หลังขาย';
  const late = after && BK_LATE, yd = bkDM(BK_LATE_DAY || bkYesterday());
  const counted = late && pend && pend.day === (BK_LATE_DAY || bkYesterday()) && pend.counted;
  const rbtn = r => `<button class="key" style="flex:1;${BK_ROUND === r ? '' : 'opacity:.45'}"
      onclick="BK_ROUND='${r}';render()">${r === 'ก่อนขาย' ? '🌅 ก่อนขาย' : '🌙 หลังขาย'}</button>`;
  const dbtn = (on, label) => `<button class="key" style="flex:1;${BK_LATE === on ? '' : 'opacity:.45'}"
      onclick="BK_LATE=${on};render()">${label}</button>`;
  const row = (id, label, unit) => `<div style="display:flex;align-items:center;gap:10px;margin:8px 0">
      <span style="flex:1">${esc(label)}</span>
      <input id="${id}" type="number" inputmode="decimal" min="0" placeholder="0"
             style="width:110px;text-align:right">
      <span class="note" style="width:28px;margin:0">${unit}</span></div>`;
  v.innerHTML = `<div class="card">
    <h2>🍡 เบเกอรี่</h2>
    <p class="lead">นับวันละ 2 รอบ — ก่อนขาย และหลังขาย · หลังขายกรอกเงินที่ได้ด้วย</p>
    <label class="fld">สาขา</label>
    <select id="bk-loc" onchange="BK_LOC=this.value;BK_AUTO=false;BK_LATE_DAY='';render()">${locs.map(l => `<option${l === selLoc ? ' selected' : ''}>${esc(l)}</option>`).join('')}</select>
    <label class="fld">รอบ</label>
    <div style="display:flex;gap:8px">${rbtn('ก่อนขาย')}${rbtn('หลังขาย')}</div>
    ${!canLate ? '' : after ? `<label class="fld">ยอดขายของ</label>
    <div style="display:flex;gap:8px">${dbtn(false, 'วันนี้')}${dbtn(true, (BK_LATE_DAY && BK_LATE_DAY !== bkYesterday() ? 'วันที่ ' : 'เมื่อวาน ') + yd + ' (ลืมนับ)')}</div>`
            : `<p class="note">ลืมนับหลังขาย${pend ? 'ของ ' + yd : 'เมื่อวาน'}? กด 🌙 หลังขาย แล้วเลือก "${pend && pend.day !== bkYesterday() ? 'วันที่ ' + yd : 'เมื่อวาน'}"</p>`}
  </div>
  <div class="card">
    <h2 style="font-size:16px">${late ? 'หลังขายของวันที่ ' + yd : 'นับ' + BK_ROUND}</h2>
    ${counted ? `<div class="warnbox" style="margin:0 0 10px">วันถัดไปนับเบเกอรี่ไปแล้ว ระบบใช้ยอดนั้นเป็นหลังขายของ ${yd}<br>
      <b>ไม่ต้องนับ</b> ปล่อยช่องว่างไว้ กรอกแค่เงินของ ${yd}</div>`
      : late ? `<div class="warnbox" style="margin:0 0 10px">นับของที่เหลือ <b>ตอนนี้ ก่อนเริ่มขายวันนี้</b> = ของที่เหลือของ ${yd}
      ระบบใช้เป็นก่อนขายของวันนี้ด้วย ไม่ต้องนับก่อนขายซ้ำ<br>
      ถ้าวันนี้ <b>นับก่อนขายไปแล้ว</b> ไม่ต้องนับ ปล่อยช่องว่างไว้ กรอกแค่เงิน</div>` : ''}
    <p class="note" style="margin-top:0">ไดฟุกุนับเป็นลูก (1 ชุด = 40 ลูก) · บราวนี่นับเป็นชิ้น</p>
    ${items.map((it, k) => row('bk-i-' + k, it.name, /^ไดฟุกุ/.test(it.name) ? 'ลูก' : 'ชิ้น')).join('')}
    ${after ? `<h2 style="font-size:16px;margin-top:16px">เงินที่ได้${late ? 'ของวันที่ ' + yd : 'วันนี้'}</h2>` +
              BK_MONEY.map(m => row('bk-m-' + m[0], m[1], 'บาท')).join('') +
              // 13/10 เจ้าของ: ค่าใช้จ่าย (รวมที่จ่ายเงินสดจากเงินขาย) แจ้งในไลน์ ไม่ต้องกรอกหน้าเว็บ
              `<p class="note">เงินสดใส่เงินที่เหลืออยู่จริง · หยิบเงินสดไปจ่ายค่าอะไร ให้เจ้าของร้านแจ้งในไลน์ (ระบบบวกกลับให้ตอนสรุป)</p>` : ''}
    <button class="key btn-red submit" id="bk-btn" onclick="submitBakery()">บันทึก${BK_ROUND}</button>
    <p class="note">ไม่มีของ / ไม่มีเงินช่องไหน ใส่ 0</p>
  </div>`;
}

async function submitBakery() {
  const items = bakeryItems(), after = BK_ROUND === 'หลังขาย', late = after && BK_LATE;
  const val = id => { const el = document.getElementById(id); return el ? el.value.trim() : ''; };
  const rows = items.map((it, k) => ({ item: it.name, qty: val('bk-i-' + k) }));
  let miss = rows.filter(r => r.qty === '' || Number(r.qty) < 0).map(r => r.item);
  // ลงย้อนหลัง: ว่างทุกช่อง = เช้านี้นับก่อนขายไปแล้ว ให้หลังบ้านใช้ยอดนั้น · กรอกบางช่อง = ต้องครบ
  if (late && miss.length === rows.length) miss = [];
  const money = {};
  BK_MONEY.forEach(m => { money[m[0]] = val('bk-m-' + m[0]); });
  if (after) BK_MONEY.forEach(m => { if (money[m[0]] === '' || Number(money[m[0]]) < 0) miss.push(m[1]); });
  if (miss.length) { toast('ยังไม่ได้กรอก: ' + esc(miss.join(', ')) + '<br><span style="opacity:.8;font-size:12.5px">ไม่มีใส่ 0</span>', 5000); return; }
  const btn = document.getElementById('bk-btn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner-sm"></span> กำลังบันทึก...';
  try {
    const r = await apiPost({ action: 'bakeryCount', location: document.getElementById('bk-loc').value,
                              round: BK_ROUND,
                              rows: rows.filter(x => x.qty !== '').map(x => ({ item: x.item, qty: Number(x.qty) })),
                              money: after ? money : null, id: after ? BK_ID : '',
                              forDay: late ? (BK_LATE_DAY || bkYesterday()) : '' });
    toast('บันทึกแล้ว ✅ ' + esc(r.message || BK_ROUND) + (r.duplicated ? ' (ส่งไปแล้ว)' : ''), 6000);
    const bl = document.getElementById('bk-loc').value;
    if (late && D.late && D.late[bl]) D.late[bl].bakery = null;      // ลงย้อนหลังแล้ว เอาเตือนออก
    BK_LATE = false; BK_LATE_DAY = '';
    if (r.tossText) alert(r.tossText);          // ของหมดอายุ — ต้องกดรับทราบ
    BK_ID = 'BK' + Date.now();
    render();                       // ล้างช่อง
  } catch (e) {
    if (/เวอร์ชันเก่า|ไม่รู้จัก action/.test(e.message)) toastApiError(e.message);
    else toast('❌ ' + esc(e.message), 6000);
    btn.disabled = false;
    btn.innerHTML = 'บันทึก' + BK_ROUND;
  }
}
