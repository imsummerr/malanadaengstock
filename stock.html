/**
 * สร้างช่องกรอกใหม่ตามสถานที่ที่เลือก
 *
 * ต้องสร้างใหม่ทุกครั้งที่เปลี่ยนสถานที่ ไม่ใช่แค่ทาสีทับ
 * เพราะแต่ละที่มีรายการไม่เท่ากัน (ครัวกลางมีผงปรุง/บรรจุภัณฑ์เพิ่มมาอีกชุด)
 * ถ้าไม่สร้างใหม่ จำนวนแถวที่มีอยู่จริงกับรายการที่โค้ดวนจะไม่ตรงกัน
 * แล้ว getElementById จะได้ null ทั้งหน้าค้างไปเลย
 */
/**
 * ช่องกรอกทั้งหมด เก็บ element ไว้ตั้งแต่ตอนสร้าง
 *
 * ของเกือบสองร้อยรายการ = ช่องกรอกห้าหกร้อยช่อง ถ้าพิมพ์ทีนึงแล้วไปไล่
 * getElementById ใหม่ทุกช่อง เครื่องจะหน่วงจนพิมพ์ไม่ทัน
 * จำไว้ตั้งแต่แรก แล้วพิมพ์ทีก็อัปเดตแค่แถวเดียว
 */
let CROWS = [];
let CDONE = 0;

/* 22/10 ลืมเช็คสต็อกปิดร้านวันก่อน แล้ววันนี้ขายไปแล้ว — เลือกว่ารอบนี้เป็นของวันไหน (เหมือนเบเกอรี่)
   'late' = ปิดร้านของวันที่ลืม · 'today' = ของวันนี้ (วันที่ลืมรวมไปเทียบกับรอบนี้) · '' = ยังไม่เลือก */
let C_FOR = '', C_FOR_LOC = '';
function countLate() {
  const el = document.getElementById('c-loc');
  const loc = el ? el.value : auth.branch;
  const m = D.late && D.late[loc] && D.late[loc].mala;
  return m && m.count ? m : null;
}
function paintCountFor() {
  const box = document.getElementById('c-for');
  if (!box) return;
  const m = countLate();
  if (!m) { box.innerHTML = ''; return; }
  if (!m.afterBill) {
    box.innerHTML = `<div class="warnbox" style="margin:10px 0 0">ลืมเช็คสต็อกปิดร้านของวันที่ ${esc(m.dm)} —
      นับตอนนี้ (ก่อนขายบิลแรก) ระบบใช้เป็นยอดปิดร้านของ ${esc(m.dm)}</div>`;
    return;
  }
  const b = (on, label) => `<button class="key" style="flex:1;${C_FOR === on ? '' : 'opacity:.45'}"
      onclick="C_FOR='${on}';paintCountFor();paintProgress()">${label}</button>`;
  box.innerHTML = `<label class="fld">นับรอบนี้เป็นของวันไหน</label>
    <div style="display:flex;gap:8px">${b('today', 'วันนี้ ' + esc(m.today || ''))}${b('late', 'ปิดร้าน ' + esc(m.dm) + ' (ลืมนับ)')}</div>
    <p class="note">${C_FOR === 'late'
      ? `ยอดที่นับตอนนี้ = ยอดปิดร้านของ ${esc(m.dm)} · ที่ขายไปวันนี้ก่อนนับ ระบบเทียบกับบิลวันนี้ในช่วงเดียวกันให้`
      : C_FOR === 'today' ? `นับของวันนี้ตามปกติ — ${esc(m.dm)} จะรวมไปเทียบกับรอบนี้ (ไม่ได้แยกยอดของ ${esc(m.dm)})`
      : `วันนี้ขายไปแล้ว — เลือกก่อนว่ารอบนี้เป็นของวันไหน`}</p>`;
}

function fillCountRows() {
  const box = document.getElementById('c-rows');
  if (!box) return;
  paintCountFor();
  const list = countItems();
  const locEl = document.getElementById('c-loc');
  const pc = piecesAt(locEl ? locEl.value : D.central);
  document.getElementById('c-head').innerHTML = pc
    ? '<span>สินค้า</span><span>โล</span><span>แพ็ค</span><span>ไม้</span><span>ชิ้น</span>'
    : '<span>สินค้า</span><span>แพ็ค</span><span>ไม้</span>';
  document.getElementById('c-card').classList.toggle('nopc', !pc);
  document.getElementById('c-card').classList.toggle('withkg', pc);
  // ของที่ชั่ง (กก./กรัม) — ครัวกลางกรอกในช่อง "โล" ช่องเดียว ช่องแพ็ค/ไม้/ชิ้นปิดไว้
  const isW = it => /^(กก\.?|กิโล|กรัม)$/.test(String(it.subUnit || '').trim());
  const off = '<input type="number" placeholder="–" disabled>';

  // กระดูกหมู/น้ำดำ — สาขานับเป็นระดับ (ต้มอยู่ในหม้อ) ครัวกลางนับเป็นถุง
  const lvAt = it => it.level && !pc;
  box.innerHTML = list.length ? list.map((it, i) => lvAt(it) ? `
    <div class="countrow" id="cr-${i}">
      <div class="nm">${esc(it.name)}<small id="cs-${i}">&nbsp;</small></div>
      <select id="clv-${i}" class="lvsel" onchange="countChanged(${i})">
        <option value="">— เหลือแค่ไหน —</option>
        ${(D.levels || []).map(l => `<option>${esc(l)}</option>`).join('')}
      </select>
    </div>` : `
    <div class="countrow" id="cr-${i}">
      <div class="nm">${esc(it.name)}<small id="cs-${i}">&nbsp;</small></div>
      ${pc && isW(it) ? `
      <input id="cr2-${i}" type="number" inputmode="decimal" min="0" step="any"
             placeholder="${esc(it.subUnit === 'กรัม' ? 'กรัม' : 'โล')}" oninput="countChanged(${i})" onblur="carryCount(${i})">
      <input id="cp-${i}" type="number" placeholder="–" disabled>${off}${off}` : `${pc ? off : ''}
      <input id="cp-${i}" type="number" inputmode="numeric" min="0" step="1"
             placeholder="${it.perPack > 1 ? esc(it.packUnit) : '–'}"
             ${it.perPack > 1 ? '' : 'disabled'} oninput="countChanged(${i})" onblur="carryCount(${i})">
      <input id="cr2-${i}" type="number" inputmode="decimal" min="0" step="any"
             placeholder="${esc(it.subUnit)}" oninput="countChanged(${i})" onblur="carryCount(${i})">
      ${pc ? `<input id="cpc-${i}" type="number" inputmode="numeric" min="0" step="1"
             placeholder="${hasPieces(it) ? 'ชิ้น' : '–'}"
             ${hasPieces(it) ? '' : 'disabled'} oninput="countChanged(${i})" onblur="carryCount(${i})">` : ''}`}
    </div>`).join('')
    : '<p class="note">— ไม่มีสินค้าสำหรับที่นี่ —</p>';

  CROWS = list.map((it, i) => ({
    row: document.getElementById('cr-' + i),
    p:   document.getElementById('cp-' + i),
    r:   document.getElementById('cr2-' + i),
    c:   document.getElementById('cpc-' + i),
    lv:  document.getElementById('clv-' + i)
  })).filter(x => x.row && (x.lv || (x.p && x.r)));

  paintCount();
}

/** ทดหน่วยในแถวนับสต็อก */
function carryCount(i) {
  const x = CROWS[i];
  if (!x || x.lv) return;
  if (carryUnits(x.p, x.r, x.c, countItems()[i])) countChanged(i);
}

/** แถวนี้นับแล้วหรือยัง */
const crFilled = x => x.lv ? x.lv.value !== ''
                           : (x.p.value !== '' || x.r.value !== '' || (x.c && x.c.value !== ''));

/** พิมพ์ทีละช่อง — แตะแค่แถวที่เปลี่ยน ไม่ต้องไล่ทั้งหน้า */
function countChanged(i) {
  const x = CROWS[i];
  if (!x) return;
  const was = x.row.classList.contains('done');
  const now = crFilled(x);
  if (was === now) return;
  x.row.classList.toggle('done', now);
  CDONE += now ? 1 : -1;
  paintCountBar();
}

/** ที่เหลือคือไม่มีของ — ใส่ 0 ให้ทีเดียว ไม่ต้องไล่จิ้มทีละช่อง */
function fillRestZero() {
  let added = 0;
  const pick = [];
  CROWS.forEach((x, i) => {
    if (crFilled(x)) return;
    // ระดับเดาแทนไม่ได้ ต้องให้คนดูของจริงแล้วเลือกเอง
    if (x.lv) { pick.push(countItems()[i].name); return; }
    if (!x.p.disabled) x.p.value = 0;
    x.r.value = 0;
    if (x.c && !x.c.disabled) x.c.value = 0;
    x.row.classList.add('done');
    added++;
  });
  CDONE += added;
  paintCountBar();
  if (pick.length) toast((added ? 'ใส่ 0 ให้ ' + added + ' รายการแล้ว<br>' : '') +
                         'เลือกระดับให้ ' + esc(pick.join(', ')) + ' ด้วย', 5000);
  else if (added) toast('ใส่ 0 ให้ ' + added + ' รายการแล้ว');
}

function paintCount() {
  const el = document.getElementById('c-loc');
  if (!el) return;
  const loc = el.value;
  countItems().forEach((it, i) => {
    const cell = document.getElementById('cs-' + i);
    if (!cell) return;
    // เจ้าของร้านเห็นยอดระบบไว้เทียบ พนักงานนับโดยไม่เห็นเฉลย
    // นอกจากเป็นเรื่องสิทธิ์แล้ว การนับแบบไม่เห็นยอดระบบยังได้ตัวเลขจริงกว่า
    if (it.level && loc !== D.central) {
      // ของที่นับเป็นระดับ ตัวเลขในระบบไม่มีความหมาย บอกแค่ว่านับครั้งก่อนเป็นยังไง
      const st = (D.stock || []).find(x => x.name === loc);
      const prev = st && st.rows.find(r => r.item === it.name);
      cell.innerHTML = isOwner() && prev ? 'ครั้งก่อน: ' + esc(prev.text) : '&nbsp;';
      return;
    }
    cell.innerHTML = isOwner()
      ? 'ระบบว่ามี ' + esc(fmtPack(balOf(loc, it.name), it))
      : '&nbsp;';
  });
  paintProgress();
}

/** ไล่ทั้งหน้า — ใช้ตอนสร้างแถวใหม่หรือเปลี่ยนสถานที่เท่านั้น */
function paintProgress() {
  CDONE = 0;
  CROWS.forEach(x => {
    const ok = crFilled(x);
    if (ok) CDONE++;
    x.row.classList.toggle('done', ok);
  });
  paintCountBar();
}

/** อัปเดตแถบความคืบหน้ากับปุ่ม — ไม่แตะช่องกรอก */
function paintCountBar() {
  const done  = CDONE;
  const total = CROWS.length;
  const left  = total - done;
  const pct = total ? Math.round(done / total * 100) : 0;
  document.getElementById('c-bar').style.width = pct + '%';
  document.getElementById('c-prog').innerHTML = left === 0
    ? `<b style="color:var(--green)">นับครบ ${done} รายการแล้ว ✓</b>`
    : `นับแล้ว ${done} / ${total} — ยังขาด ${left}`;

  // ปิดปุ่มไว้จนกว่าจะนับครบ กดไม่ได้เลย ไม่ใช่กดแล้วค่อยเด้งเตือน
  const btn = document.getElementById('c-btn');
  if (btn) {
    const lm = countLate(), pick = lm && lm.afterBill && !C_FOR;
    btn.disabled = total === 0 || left > 0 || pick;
    btn.textContent = total === 0 ? 'ไม่มีสินค้าให้นับ'
                    : left > 0 ? `ยังขาดอีก ${left} รายการ` : pick ? 'เลือกก่อนว่านับของวันไหน' : 'บันทึกผลนับ';
  }
}

async function submitCount() {
  const list = countItems();
  const rows = CROWS.map((x, i) => x.lv
    ? { item: list[i].name, level: x.lv.value }
    : { item: list[i].name, packs: x.p.value, rem: x.r.value, pieces: x.c ? x.c.value : '' });
  if (!rows.length) return toast('ไม่มีสินค้าให้นับที่นี่');
  const missing = rows.filter(r => r.level !== undefined ? r.level === ''
                                  : r.packs === '' && r.rem === '' && r.pieces === '');
  if (missing.length) {
    toast('ยังนับไม่ครบ ขาดอีก ' + missing.length + ' รายการ<br>' +
          '<span style="opacity:.8;font-size:12.5px">' + esc(missing.slice(0, 3).map(m => m.item).join(', ')) +
          (missing.length > 3 ? ' …' : '') + '</span>', 5000);
    return;
  }
  const btn = document.getElementById('c-btn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner-sm"></span> กำลังบันทึก...';
  try {
    const cl = document.getElementById('c-loc').value;
    const lm0 = countLate();
    if (lm0 && lm0.afterBill && !C_FOR) throw new Error('เลือกก่อนว่ารอบนี้เป็นของวันไหน');
    const forDay = lm0 && lm0.afterBill && C_FOR === 'late' ? lm0.day : '';
    const r = await apiPost({ action: 'stockCount', location: cl, rows, forDay });
    C_FOR = ''; C_FOR_LOC = '';
    // นับปิดร้านย้อนหลังแล้ว (ก่อนบิลแรก) — เอาเตือนนับออก เหลือเตือนเงินถ้ายังไม่กรอก
    const lm = D.late && D.late[cl] && D.late[cl].mala;
    if (lm) { lm.count = false; if (!lm.cash) D.late[cl].mala = null; }
    toast('บันทึกแล้ว ✅ นับครบ ' + r.counted + ' รายการ<br>' +
          '<span style="opacity:.8;font-size:12.5px">' +
          (r.diffs ? 'ไม่ตรงกับระบบ ' + r.diffs + ' รายการ' : 'ตรงกับระบบทุกรายการ 🎉') +
          (r.refill ? '<br>🔔 ต้องเติม ' + r.refill + ' อย่าง' : '') + '</span>', 5500);
    // ของที่ต้องทิ้ง — ต้องกดรับทราบ ไม่ใช่แค่ขึ้นแล้วหายไป
    if (r.tossText) alert(r.tossText);
    btn.disabled = false;
    btn.innerHTML = 'บันทึกผลนับ';
    go('stock');
    refreshInBackground();
  } catch (e) {
    if (/เวอร์ชันเก่า/.test(e.message)) toastApiError(e.message);
    else toast('❌ ' + esc(e.message), 6000);
    btn.disabled = false;
    btn.innerHTML = 'บันทึกผลนับ';
    paintProgress();          // เผื่อมีช่องว่างอยู่ ปุ่มจะได้ปิดกลับ
  }
}

/* ════════════════════════════════════════════════════════ */
/* ── จำข้อมูลรอบก่อนไว้ในเครื่อง เปิดหน้าแล้วโชว์ได้ทันที แล้วค่อยอัปเดตตามหลัง ──
   หลังบ้าน Apps Script ตื่นช้า (2–5 วิ) ทุกครั้งที่เปิดหน้า ถ้ารอก่อนค่อยโชว์ จะดูเหมือนค้าง
   แยกตามชื่อคน+สิทธิ์ — เครื่องเดียวกันแต่คนละคนจะไม่เห็นของกันและกัน · ออกจากระบบแล้วลบทิ้ง */
function bootKey() { return 'stock_boot_' + (auth.role || '') + '_' + (auth.name || ''); }
function readBootCache() {
  try { const o = JSON.parse(localStorage.getItem(bootKey()) || 'null'); return o && o.items ? o : null; }
  catch (e) { return null; }
}
function saveBootCache(d) { try { localStorage.setItem(bootKey(), JSON.stringify(d)); } catch (e) {} }
function clearBootCache() {
  try { Object.keys(localStorage).filter(k => k.indexOf('stock_boot_') === 0).forEach(k => localStorage.removeItem(k)); }
  catch (e) {}
}
const itemSig = d => (d && d.items || []).map(i => i.name + '|' + i.subUnit + '|' + i.perPack).join(',');

/**
 * โหลดใหม่ตามหลังหลังบันทึก — ไม่ต้องให้คนรอ ของลงชีตไปแล้ว
 * หน้าที่ดูยอด (สต็อก/บัญชี) วาดใหม่ให้เลย · หน้ากรอกฟอร์มไม่วาดทับ เดี๋ยวช่องที่พิมพ์อยู่หาย
 * ยกเว้นรายการสินค้าเปลี่ยน (เพิ่ม/ลบของ) ต้องวาดใหม่ ไม่งั้นนับไม่ครบ
 */
function refreshInBackground(after) {
  const before = itemSig(D);
  loadData().then(() => {
    if (tab === 'stock' || itemSig(D) !== before) render();
    syncFilesBanner();
    if (after) after();
  }).catch(() => {});
}

async function loadData() {
  const r = await apiGet({ action: 'stockBootstrap' });
  D = r.data;
  saveBootCache(D);
  D_FRESH = true;
  // เซิร์ฟเวอร์เป็นตัวตัดสินว่าคนนี้ทำที่ไหนได้บ้าง ยึดค่าที่ส่งกลับมาเป็นหลัก
  if (D.branches && D.branches.length) {
    auth.branches = D.branches.slice();
    auth.branch = D.branches[0];
    try { sessionStorage.setItem('pos_branches', D.branches.join(', ')); } catch (e) {}
  }
  const where = myLocs().join(' + ');
  // โชว์รุ่นของทั้งสองฝั่ง — หน้าเว็บกับหลังบ้านที่กำลังคุยด้วยจริง ๆ
  // ถ้าหลังบ้านขึ้นว่า "เก่า" แปลว่ายิงไป deployment ผิดตัว ไม่ใช่โค้ดผิด
  const be = D.version ? String(D.version).split('·')[0].trim() : 'เก่า (ไม่บอกรุ่น)';
  document.getElementById('hdr-sub').textContent =
    auth.name + (where ? ' • ' + where : '') + (isOwner() ? ' • เจ้าของร้าน' : '') +
    ' • v' + PAGE_BUILD + ' · หลังบ้าน ' + be;
}

async function showApp() {
  readAuth();
  document.getElementById('login-page').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  const mine = myTabs();
  if (!mine.some(t => t.id === tab)) tab = mine.length ? mine[0].id : 'waste';
  renderTabs();
  // มีข้อมูลรอบก่อน = โชว์เลย แล้วอัปเดตตามหลัง (ไม่ต้องจ้องหน้าโหลดทุกครั้ง)
  const cached = readBootCache();
  if (cached) {
    D = cached;
    D_FRESH = false;
    render();
    refreshInBackground();
    return;
  }
  document.getElementById('view').innerHTML = '<div class="card"><div class="empty">กำลังโหลด...</div></div>';
  try {
    await loadData();
    render();
  } catch (e) {
    // ขึ้นปุ่มรีเซ็ต URL ให้เลยถ้าสาเหตุคือ URL เก่าที่เคยตั้งเองไว้
    const btn = (/เวอร์ชันเก่า/.test(e.message) && usingSavedUrl())
      ? '<button class="key btn-red" style="margin-top:12px" onclick="resetApiUrl()">' +
        'ใช้ URL ที่มากับไฟล์</button>'
      : '';
    document.getElementById('view').innerHTML =
      `<div class="card"><div class="warnbox" style="margin:0">❌ ${esc(e.message).replace(/\n/g, '<br>')}</div>${btn}</div>`;
  }
}

readAuth();
if (auth.token) showApp();
</script>
